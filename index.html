<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>VBGRAMG Tools</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; }
    main { width: min(100%, 560px); padding: 32px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
    p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
    .buttons { display: grid; grid-template-columns: 1fr; gap: 12px; }
    button { width: 100%; min-height: 54px; padding: 14px 18px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; color: #0f172a; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #f8fafc; border-color: #64748b; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .note { margin: 20px 0 0; font-size: .875rem; color: #64748b; }
    @media (min-width: 480px) { .buttons { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>VBGRAMG Tools</h1>
    <p>Choose a tool to continue.</p>
    <div class="buttons">
      <button type="button" id="button-1">Button 1</button>
      <button type="button" id="button-2">Button 2</button>
    </div>
    <p class="note">Both buttons are placeholders for now. Their actions can be added independently later.</p>
  </main>
</body>
</html>
