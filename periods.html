<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>Periods — VBGRAMG</title>
<style>
:root{
  color-scheme:light;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#172033;background:#f3f6fb;
  --ink:#172033;--muted:#667085;--line:#e3e8f0;
  --surface:#fff;--surface-soft:#f7f9fc;
  --accent:#2457c5;--green:#17663a;--green-bg:#eaf8ef;
  --closed:#667085;--closed-bg:#f0f2f5;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;padding:20px;background:#f3f6fb;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
main{width:min(100%,1440px);max-width:1440px;margin:0 auto;padding:0 0 44px;min-width:0}
.panel{min-width:0;padding:clamp(18px,2.5vw,28px);margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px rgb(23 32 51 / 4%)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel h2{margin:0;font-size:1.18rem;letter-spacing:-.02em;line-height:1.3}
button,.link{
  box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
  min-height:40px;padding:9px 13px;border:1px solid #cbd5e1;border-radius:10px;
  background:#e2e8f0;color:#0f172a;font:650 .88rem/1.2 inherit;
  cursor:pointer;text-decoration:none;box-shadow:none;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
button:hover{background:#d7e0ec}
button.primary{background:#172033;border-color:#172033;color:#fff}
button.primary:hover{background:#2c3b55;border-color:#2c3b55}
button.secondary{background:#e2e8f0;border-color:#cbd5e1;color:#0f172a}
button.secondary:hover{background:#d7e0ec}
button.danger{background:#fff;border-color:#f2c9c4;color:#a12b20}
button.danger:hover{background:#fff4f2;border-color:#e9aaa2}
button:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}
button:disabled{opacity:.48;cursor:not-allowed}
#toggle-create{background:#172033;border-color:#172033;color:#fff}
#toggle-create:hover{background:#2c3b55;border-color:#2c3b55}
.status{margin:12px 0 0;padding:11px 13px;border:1px solid #e5eaf2;border-radius:10px;background:#f7f9fc;color:#475467;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem}
.status.error{background:#fff4f2;border-color:#ffd8d2;color:#a12b20}
.status.success{background:#effaf3;border-color:#ccebd7;color:#17663a}
.hidden{display:none!important}
.table-wrap{max-width:100%;overflow:auto;overscroll-behavior:contain;border:1px solid #dfe5ee;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgb(23 32 51 / 3%)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;white-space:normal}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e8edf4;vertical-align:middle;overflow-wrap:anywhere}
thead th{background:#edf2f8;color:#475467;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:750;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:750;background:var(--green-bg);color:var(--green)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.closed{background:var(--closed-bg);color:var(--closed)}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.row-actions button{min-width:96px;min-height:40px;padding:9px 12px;font-size:.88rem;white-space:nowrap}
.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:.9rem}
.muted{color:var(--muted);font-size:.84rem;line-height:1.45}
.period-mobile-meta{display:none}
#period-pager{margin-top:12px}
dialog#create-dialog{
  width:min(92vw,440px);max-height:90vh;overflow:auto;padding:0;
  border:1px solid var(--line);border-radius:16px;background:var(--surface);
  color:var(--ink);box-shadow:0 18px 55px rgb(15 23 42 / 22%);
}
dialog#create-dialog::backdrop{background:rgb(15 23 42 / 48%)}
.dialog-content{padding:22px}
.dialog-content h2{margin:0 0 8px;font-size:1.18rem}
.dialog-content .sub{margin:7px 0 18px;color:var(--muted);font-size:.88rem;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.field label{display:block;margin:0 0 6px;color:#344054;font-size:.82rem;font-weight:700}
.field input,.field select{width:100%;min-height:46px;padding:10px 12px;border:1px solid #cfd7e4;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
.field input:focus,.field select:focus{outline:3px solid rgb(36 87 197 / 15%);border-color:#6f91dc}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog-actions button{min-width:112px}
@media(min-width:768px){
  .table-wrap{overflow-x:auto;overflow-y:hidden}
  .table-wrap table{min-width:760px;table-layout:fixed}
  .table-wrap th:nth-child(1),.table-wrap td:nth-child(1){width:23%}
  .table-wrap th:nth-child(2),.table-wrap td:nth-child(2){width:16%}
  .table-wrap th:nth-child(3),.table-wrap td:nth-child(3){width:34%}
  .table-wrap th:nth-child(4),.table-wrap td:nth-child(4){width:27%}
  .table-wrap tbody td:nth-child(1),.table-wrap tbody td:nth-child(2){white-space:nowrap}
  .table-wrap tbody td:nth-child(1){font-weight:700}
  .table-wrap tbody td:nth-child(3){color:var(--muted);font-size:.84rem}
}
@media(max-width:767px){
  body{padding:10px}
  main{padding-bottom:44px}
  .panel{padding:14px;border-radius:13px;margin-bottom:12px}
  .panel-head{align-items:center;gap:10px;margin-bottom:13px}
  .panel h2{font-size:1.18rem;letter-spacing:-.02em;line-height:1.3}
  #toggle-create{min-height:40px;padding:9px 12px;font-size:.88rem}
  .table-wrap{overflow:visible;border:0;background:transparent;box-shadow:none}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  #period-body tr:not(:has(.empty)){
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center;column-gap:10px;padding:13px 12px;margin-bottom:9px;
    border:1px solid #dfe5ee;border-radius:13px;background:#fff;
    box-shadow:0 2px 8px rgb(23 32 51 / 3%);
  }
  #period-body td{min-width:0;padding:0;border:0}
  #period-body td[data-label="Period"]{grid-column:1;grid-row:1;font-size:.96rem;font-weight:750;line-height:1.35}
  #period-body .period-mobile-meta{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;font-weight:450;line-height:1.45}
  #period-body td[data-label="Status"],#period-body td[data-label="Created"]{display:none}
  #period-body td[data-label="Actions"]{grid-column:2;grid-row:1;display:block;align-self:center}
  #period-body .row-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  #period-body .row-actions button{width:100%;min-width:0;min-height:40px;padding:8px 6px;font-size:.82rem;line-height:1.2;white-space:normal}
  #period-body .row-actions button[data-action="delete"]{background:#f0f3f8;color:#667085;border-color:#e0e6ef}
  #period-body tr:has(.empty){display:block}
  .dialog-content{padding:18px}
  .dialog-actions{display:grid;grid-template-columns:1fr 1fr}
  .dialog-actions button{width:100%;min-width:0;min-height:42px;padding:9px 10px}
}
@media(max-width:360px){
  body{padding:8px}
  .panel{padding:12px}
  .panel-head{gap:7px}
  #period-body tr:not(:has(.empty)){padding:11px 10px;column-gap:7px}
  #period-body .period-mobile-meta{font-size:.68rem}
  #period-body .row-actions{gap:5px}
  #period-body .row-actions button{font-size:.8rem;padding:8px 4px}
  #toggle-create{font-size:.82rem;padding:8px 10px}
}
</style>
  <link rel="stylesheet" href="./responsive.css"></head><body><main>

<section class="panel"><div class="panel-head"><h2>All periods</h2><button id="toggle-create" class="secondary" type="button">+ Create period</button></div><dialog id="create-dialog" aria-labelledby="create-heading"><div class="dialog-content"><h2 id="create-heading">Create period</h2><p class="sub">Period names are generated automatically, such as MAY26 and MAY26 (2).</p><div class="grid" id="create-form"><div class="field"><label for="new-month">Charge month</label><input id="new-month" type="month" required></div></div><p class="muted">The first period is dated on the 1st of the charge month; the second on the 2nd, and so on.</p><div class="actions dialog-actions"><button id="create-period" type="button">Save period</button><button id="cancel-create" class="secondary" type="button">Cancel</button></div></div></dialog><div id="status" class="status hidden" aria-live="polite"></div>
<div class="table-wrap"><table><thead><tr><th>Period</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="period-body"><tr><td colspan="4" class="empty">Loading periods…</td></tr></tbody></table></div><div id="period-pager" class="mobile-table-pager" hidden><button id="period-prev" class="secondary" type="button">Previous</button><span id="period-page-label"></span><button id="period-next" class="secondary" type="button">Next</button></div></section>
</main><script src="./js/supabase-client.js?v=20261104b"></script><script src="./js/data-loader.js?v=20261104b"></script><script>
const $=id=>document.getElementById(id);let periods=[],sessionUser=null,periodsPage=0;const periodsPageSize=10;
function setStatus(msg,type=""){if((type==="success"||type==="error")&&window.showToast){window.showToast(msg,type);const el=$("status");el.textContent="";el.className="status hidden";return}const el=$("status");el.textContent=msg;el.className="status"+(type?" "+type:"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function verify(){let client;try{client=await window.VBGRAMG_SUPABASE_READY}catch(error){setStatus(error.message||"Could not initialise the database connection.","error");return false}const {data,error}=await client.auth.getSession();if(error||!data.session){location.replace("./");return false}try{const access=await window.VBGRAMGData.request("vbgramg-app-access",{body:{}});if(!access||access.approved!==true)throw new Error("App access was denied.")}catch(error){await client.auth.signOut();location.replace("./");return false}sessionUser=data.session.user;return true}
async function call(action,extra={},options={}){return window.VBGRAMGData.request("vbgramg-periods",{body:{action,...extra},...options})}
function render(){const body=$("period-body"),isMobile=window.matchMedia("(max-width: 767px)").matches,totalPages=Math.max(1,Math.ceil(periods.length/periodsPageSize));periodsPage=Math.min(periodsPage,totalPages-1);const start=isMobile?periodsPage*periodsPageSize:0,visiblePeriods=isMobile?periods.slice(start,start+periodsPageSize):periods;body.replaceChildren();if(!periods.length){$("period-pager").hidden=true;const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=4;td.className="empty";td.textContent="No periods yet. Use Create period to add the first period.";tr.appendChild(td);body.appendChild(tr);return}
for(const p of visiblePeriods){const tr=document.createElement("tr");const created=p.created_at?new Date(p.created_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"—";const month=p.contribution_month||p.period_date;const monthText=month?new Date(month+"T00:00:00Z").toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"}):"Legacy month unknown";const periodTd=document.createElement("td");periodTd.dataset.label="Period";periodTd.className="period-name-cell";periodTd.textContent=String(p.period_name??"—");const meta=document.createElement("span");meta.className="period-mobile-meta";meta.textContent=(p.status==="open"?"Open":"Closed")+" · "+created;periodTd.appendChild(meta);tr.appendChild(periodTd);const statusTd=document.createElement("td");statusTd.dataset.label="Status";const badge=document.createElement("span");badge.className="pill"+(p.status==="closed"?" closed":"");badge.textContent=p.status==="open"?"Open":"Closed";statusTd.appendChild(badge);tr.appendChild(statusTd);const createdTd=document.createElement("td");createdTd.dataset.label="Created";createdTd.textContent=created;tr.appendChild(createdTd);
const td=document.createElement("td");td.dataset.label="Actions";const actions=document.createElement("div");actions.className="row-actions";
const toggle=document.createElement("button");toggle.type="button";toggle.className=p.status==="open"?"danger":"secondary";toggle.textContent=p.status==="open"?"Close":"Reopen";toggle.addEventListener("click",()=>togglePeriod(p));actions.appendChild(toggle);if(!p.used){const del=document.createElement("button");del.type="button";del.className="danger";del.dataset.action="delete";del.textContent="Delete";del.addEventListener("click",()=>deletePeriod(p));actions.appendChild(del);}td.appendChild(actions);tr.appendChild(td);body.appendChild(tr)}const showPager=isMobile&&periods.length>periodsPageSize;$("period-pager").hidden=!showPager;$("period-page-label").textContent="Page "+(periodsPage+1)+" of "+totalPages;$("period-prev").disabled=periodsPage<=0;$("period-next").disabled=periodsPage>=totalPages-1;}
async function createPeriod(){const month=$("new-month").value,periodDate=month?month+"-01":"";if(!month){setStatus("Choose a charge month.","error");return}$("create-period").disabled=true;try{const r=await call("create",{contributionMonth:month+"-01",periodDate});setStatus("Created period "+r.period.period_name+" dated "+periodDate+".","success");$("new-month").value="";await load()}catch(e){setStatus(e.message,"error")}finally{$("create-period").disabled=false}}
async function deletePeriod(p){if(!confirm("Delete period “"+p.period_name+"”? Deletion is allowed only when this period has never been used."))return;try{await call("delete",{id:p.id});setStatus("Period "+p.period_name+" deleted.","success");await load()}catch(e){setStatus(e.message,"error")}}
async function load(){$("period-pager").hidden=true;try{const result=await call("list",{}, {deduplicate:true});periods=result.periods||[];periodsPage=0;render();$("status").textContent="";$("status").className="status hidden"}catch(e){setStatus(e.message,"error")}}
async function togglePeriod(p){const action=p.status==="open"?"close":"reopen";if(!confirm((action==="close"?"Close":"Reopen")+" period “"+p.period_name+"”? "+(action==="close"?"It will no longer appear in normal assignment dropdowns.":"It will become available for new assignments.")))return;try{await call(action,{id:p.id});setStatus("Period "+p.period_name+" "+(action==="close"?"closed.":"reopened."),"success");await load()}catch(e){setStatus(e.message,"error")}}

$("period-prev").addEventListener("click",()=>{periodsPage=Math.max(0,periodsPage-1);render()});$("period-next").addEventListener("click",()=>{periodsPage++;render()});
let lastPeriodsMobile=window.matchMedia("(max-width: 767px)").matches;window.addEventListener("resize",()=>{const next=window.matchMedia("(max-width: 767px)").matches;if(next!==lastPeriodsMobile){lastPeriodsMobile=next;render()}});
$("create-period").addEventListener("click",createPeriod);$("toggle-create").addEventListener("click",()=>{const dialog=$("create-dialog");if(typeof dialog.showModal==="function")dialog.showModal();else dialog.setAttribute("open","");$("new-month").focus()});$("cancel-create").addEventListener("click",()=>{$("new-month").value="";$("create-dialog").close()});$("create-dialog").addEventListener("close",()=>{$("new-month").value=""});
(async()=>{if(await verify())await load()})();
</script><script src="./toast.js?v=20261103"></script><script src="./navigation.js?v=20261105-unified-header"></script></body></html>
