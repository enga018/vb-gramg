async function showExtraChargeAudit(append=false){

  const dateLabel=value=>value?new Date(value).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"Date not recorded";
  const rows=auditRows.map(row=>{
   const before=row.before_data||{},after=row.after_data||{},beforeExtra=before.extra||{},afterExtra=after.extra||{};
   const isEdit=row.action==="extra_contribution_charge_edit";
   const isManualCharge=row.action==="manual_contribution_charge"||row.action==="manual_contribution_extra_charge";
   const heading=isManualCharge?(after.charge_kind==="extra"?"Manual extra charge added":"Manual regular charge added"):isEdit?"Extra contribution edited":"Payment allocation released";
   const detail=isManualCharge
    ?'<div><b>Charge:</b> '+money(after.amount)+'</div><div><b>Entry date:</b> '+esc(after.entry_date||"Not recorded")+'</div><div><b>Reason:</b> '+esc(after.reason||"Not recorded")+'</div>'

async function saveExemption(){

 const payment=c.ledger.find(e=>String(e.id)===String(transactionId)&&e.entry_type==="payment");if(!payment)return;
 const current=paymentAllocations.filter(a=>String(a.transaction_id)===String(transactionId));
 const options=[...periods].filter(p=>c.ledger.some(e=>String(e.period_id||"")===String(p.id)&&(e.entry_type==="charge"||e.entry_type==="other_charge")&&!e.is_deferred&&!e.is_voided)).sort((a,b)=>String(a.contribution_month||a.period_date||"").localeCompare(String(b.contribution_month||b.period_date||""))||String(a.created_at||"").localeCompare(String(b.created_at||"")));
 const optionHtml=options.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.period_name||formatPeriod(p.contribution_month||p.period_date))+'</option>').join('');
 const rows=current.length?current.map(a=>({period_id:a.period_id,amount:a.amount,note:a.note||""})):[{period_id:options[0]?.id||"",amount:"",note:""}];
 const rowHtml=(row,i)=>'<div class="allocation-edit-row" data-allocation-row="'+i+'" style="border:1px solid var(--line,#ddd);border-radius:10px;padding:10px;margin:8px 0"><div class="field"><label>Contribution period</label><select data-allocation-period>'+optionHtml+'</select></div><div class="field"><label>Amount (₹)</label><input data-allocation-amount type="number" min="0.01" step="0.01" max="'+Number(c.balance).toFixed(2)+'" value="'+esc(row.amount??"")+'" inputmode="decimal"></div><div class="field"><label>Review note (optional)</label><input data-allocation-note maxlength="300" value="'+esc(row.note||"")+'" placeholder="Evidence / reason"></div><button class="btn ghost small" type="button" data-remove-allocation>Remove period</button></div>';
 $('sheetFooter').classList.add('hidden');
 $('sheetBody').innerHTML='<div class="section-title">Review payment allocation</div><div class="notice info">Payment: <b>'+fmt(payment.amount)+'</b> · '+esc(day(String(payment.entry_date||"").slice(0,10)))+'<br>Allocate the payment across one or more eligible periods. The total allocated cannot exceed the payment amount. Saving replaces this payment’s existing allocation only.</div><form id="allocationForm"><div id="allocationRows">'+rows.map(rowHtml).join('')+'</div><button class="btn ghost" type="button" id="addAllocationRow">Add period</button><div id="allocationTotal" class="muted" style="margin:10px 0"></div><button class="btn" type="submit" id="saveAllocationBtn">Save allocation</button> <button class="btn ghost" type="button" id="cancelAllocationBtn">Cancel</button></form>';
 const setSelects=()=>document.querySelectorAll('[data-allocation-row]').forEach((row,i)=>{const select=row.querySelector('[data-allocation-period]');select.value=String(rows[i]?.period_id||"");});
 setSelects();
 const updateTotal=()=>{let total=0;document.querySelectorAll('[data-allocation-amount]').forEach(x=>total+=Math.max(0,Number(x.value)||0));$('allocationTotal').textContent='Total allocated: '+fmt(total)+' · Unallocated: '+fmt(Math.max(0,Number(payment.amount)-total));};
 $('allocationRows').addEventListener('input',updateTotal);
 $('allocationRows').addEventListener('change',updateTotal);
 $('allocationRows').addEventListener('click',ev=>{const btn=ev.target.closest('[data-remove-allocation]');if(!btn)return;const row=btn.closest('[data-allocation-row]');if(row)row.remove();updateTotal();});
 $('addAllocationRow').addEventListener('click',()=>{const host=$('allocationRows');const i=host.children.length;const nextPeriod=options.find(p=>!Array.from(host.querySelectorAll('[data-allocation-period]')).some(s=>s.value===String(p.id)))?.id||options[0]?.id||"";host.insertAdjacentHTML('beforeend',rowHtml({period_id:nextPeriod,amount:"",note:""},i));const added=host.lastElementChild;if(added)added.querySelector('[data-allocation-period]').value=String(nextPeriod);updateTotal();});
 $('cancelAllocationBtn').addEventListener('click',()=>openCitizen(c.id));
 updateTotal();
 $('allocationForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const allocations=[];let invalid=false;
  document.querySelectorAll('[data-allocation-row]').forEach(row=>{const period_id=row.querySelector('[data-allocation-period]').value,amount=Number(row.querySelector('[data-allocation-amount]').value),note=row.querySelector('[data-allocation-note]').value.trim();if(!period_id&&!amount)return;if(!period_id||!Number.isFinite(amount)||amount<=0){invalid=true;return;}allocations.push({period_id,amount,note,confidence:"confirmed"});});
  const total=allocations.reduce((s,a)=>s+a.amount,0);
  if(invalid){status('Each row must have a period and a positive amount, or be removed.','error');return;}
  if(total>Number(payment.amount)+0.00001){status('Allocated amount cannot exceed the payment.','error');return;}
  busy=true;$('saveAllocationBtn').disabled=true;$('saveAllocationBtn').textContent='Saving…';
  try{
   const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:'set-payment-allocations',transaction_id:payment.id,allocations,allocation_source:'manual'},timeoutMs:false});
   if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save allocation.');
   paymentAllocations=paymentAllocations.filter(a=>String(a.transaction_id)!==String(payment.id)).concat(data.allocations||[]);
   openCitizen(c.id);status('Payment allocation saved.','info');
  }catch(err){status(err.message||'Could not save allocation.','error');}
  finally{busy=false;if($('saveAllocationBtn')){$('saveAllocationBtn').disabled=false;$('saveAllocationBtn').textContent='Save allocation';}}
 });
}

function showExtraChargeForm(preferredPeriodId){
 $('sheetFooter').classList.add('hidden');
 const c=currentCitizen;if(!c||appRole!=="admin")return;
 const existingForCard=extraCharges.filter(x=>String(x.job_card_number)===String(c.id));
 const periodMonth=p=>String(p.contribution_month||p.period_date||'').slice(0,7);
 const sortedPeriods=[...periods].sort((a,b)=>periodMonth(b).localeCompare(periodMonth(a))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
 const roundLabel=p=>String(p.period_name||'').trim()+(p.status==='closed'?' · Closed':'');
 const currentMonth=new Date().toISOString().slice(0,7);
 const defaultPeriod=sortedPeriods.find(p=>preferredPeriodId&&String(p.id)===String(preferredPeriodId))||sortedPeriods.find(p=>existingForCard.some(x=>String(x.period_id||'')===String(p.id)))||sortedPeriods.find(p=>periodMonth(p)===currentMonth&&p.status!=='closed')||sortedPeriods[0];
 const defaultExtra=defaultPeriod?existingForCard.find(x=>String(x.period_id||'')===String(defaultPeriod.id)):null;
 $('sheetBody').innerHTML='<div class="notice info">Add or edit an extra amount for a specific contribution round. Each job card can have a separate extra amount in each round; the formula-generated charge is not changed.</div>'+(existingForCard.some(x=>!x.period_id)?'<div class="notice info">An older extra amount is not linked to a round. It remains in history as a legacy entry; review it before adding a replacement for the same month.</div>':'')+'<form id="extraChargeForm"><div class="field"><label for="extraPeriod">Contribution round</label><select id="extraPeriod" required>'+(sortedPeriods.map(p=>'<option value="'+esc(p.id)+'" '+(defaultPeriod&&String(defaultPeriod.id)===String(p.id)?'selected':'')+'>'+esc(roundLabel(p))+'</option>').join(''))+'</select></div><div class="field"><label for="extraAmount">Extra amount (₹)</label><input id="extraAmount" type="number" min="0.01" max="'+Number(c.balance).toFixed(2)+'" step="0.01" required inputmode="decimal" value="'+(defaultExtra?esc(defaultExtra.amount):'')+'" placeholder="Enter additional amount"></div><div class="field"><label for="extraReason">Reason</label><textarea id="extraReason" rows="3" maxlength="500" required placeholder="Why is this extra amount needed?">'+(defaultExtra?esc(defaultExtra.reason):'')+'</textarea></div><button class="btn" id="saveExtraAmount" type="submit">Save extra amount</button> <button class="btn ghost" id="cancelExtraAmount" type="button">Cancel</button></form>';
 const syncFormForPeriod=()=>{
  const periodId=$('extraPeriod').value;
  const old=existingForCard.find(x=>String(x.period_id||'')===periodId);
  $('extraAmount').value=old?String(old.amount):'';
  $('extraReason').value=old?String(old.reason||''):'';
 };
 $('extraPeriod').addEventListener('change',syncFormForPeriod);
 $('cancelExtraAmount').addEventListener('click',()=>openCitizen(c.id));
 $('extraChargeForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const periodId=$('extraPeriod').value,selectedPeriod=periods.find(p=>String(p.id)===periodId),month=selectedPeriod?periodMonth(selectedPeriod):'',amount=Number($('extraAmount').value),reason=$('extraReason').value.trim();
  if(!periodId||!month||!Number.isFinite(amount)||amount<=0){status('Choose a contribution round and enter an extra amount greater than zero.','error');return;}
  if(!reason){status('Enter a reason for the extra amount.','error');return;}
  busy=true;$('saveExtraAmount').disabled=true;$('saveExtraAmount').textContent='Saving…';
  try{
   const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:'save-contribution-extra',job_card_number:c.id,period_id:periodId,charge_period:month+'-01',amount,reason},timeoutMs:false});
   if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save extra amount.');
   updateEntryInMemory(data.entry);
   extraCharges=extraCharges.filter(x=>!(String(x.job_card_number)===String(data.extra.job_card_number)&&String(x.period_id||'')===String(data.extra.period_id||'')));
   extraCharges.push(data.extra);
   openCitizen(c.id);
   status((data.updated?'Extra amount updated.':'Extra amount saved.')+' Formula-generated charges remain unchanged.','info');
  }catch(err){status(err.message||'Could not save extra amount.','error');}
  finally{busy=false;if($('saveExtraAmount')){$('saveExtraAmount').disabled=false;$('saveExtraAmount').textContent='Save extra amount';}}
 });
}

const parseBulkPayments = window.VBGRAMGPayments.parseBulkPayments;
function showManualChargeForm(){
 if(appRole!=="admin"){status("Only an approved administrator can add manual charges.","error");return;}
 const openPeriods=periods.filter(p=>p.status!=="closed"&&/^\d{4}-\d{2}$/.test(String(p.contribution_month||p.period_date||"").slice(0,7)));
 $('sheetTitle').textContent="Manual contribution charges";
 $('sheetSubtitle').textContent="Regular or extra · individual or bulk";
 $('sheetFooter').classList.add('hidden');
 $('toggleEditMode').classList.add('hidden');
 $('sheetBody').innerHTML='<div class="notice info">Create charges without importing an FTO. Regular charges and extra charges are recorded separately. Existing FTO charges are not replaced. A batch is saved all-or-nothing.</div>'+
 '<form id="manualChargeForm">'+
 '<div class="grid2"><div class="field"><label for="manualChargeKind">Charge type</label><select id="manualChargeKind"><option value="regular">Regular charge</option><option value="extra">Extra charge</option></select></div>'+
 '<div class="field"><label for="manualChargePeriod">Contribution round</label><select id="manualChargePeriod" required>'+openPeriods.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.period_name||"Contribution round")+'</option>').join('')+'</select></div></div>'+
 '<div class="grid2"><div class="field"><label for="manualChargeDate">Default entry date</label><input id="manualChargeDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div>'+
 '<div class="field"><label for="manualChargeMode">Entry mode</label><select id="manualChargeMode"><option value="single">Single job card</option><option value="bulk">Bulk job cards</option></select></div></div>'+
 '<div class="field"><label for="manualChargeAmountMode">Amount entry</label><select id="manualChargeAmountMode"><option value="same">Same amount for every job card</option><option value="individual">Different amount per job card</option></select></div>'+
 '<div class="field" id="manualSingleCardField"><label for="manualSingleCard">Full job card number</label><input id="manualSingleCard" list="manualChargeCardsList" type="text" maxlength="100" placeholder="Search or enter a full job card number" autocomplete="off"><datalist id="manualChargeCardsList">'+citizens.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</datalist></div>'+
 '<div class="field hidden" id="manualBulkCardsField"><label for="manualBulkCards">Job card numbers</label><textarea id="manualBulkCards" rows="7" placeholder="One full job card number per line"></textarea><p class="muted">For individual amounts, use one row per card: job card, amount, optional date. Commas or tabs are accepted.</p></div>'+
 '<div class="field" id="manualSameAmountField"><label for="manualSameAmount">Amount per job card (₹)</label><input id="manualSameAmount" type="number" min="0.01" max="10000000" step="0.01" inputmode="decimal" placeholder="Enter amount"></div>'+
 '<div class="field"><label for="manualChargeReason">Reason / reference</label><textarea id="manualChargeReason" rows="2" maxlength="500" required placeholder="Reason for this manual charge"></textarea></div>'+
 '<div class="actions"><button class="btn" id="previewManualCharges" type="button">Preview charges</button><button class="btn ghost" id="cancelManualCharges" type="button">Cancel</button></div><div id="manualChargePreview"></div></form>';
 $('overlay').classList.remove('hidden');
 if(!openPeriods.length){$('manualChargeForm').innerHTML='<div class="notice err">No contribution rounds are available. Create or open a contribution round first.</div><button class="btn ghost" id="cancelManualCharges" type="button">Close</button>';$('cancelManualCharges').addEventListener('click',closeCitizenDetail);return;}
 const mode=$('manualChargeMode'),amountMode=$('manualChargeAmountMode');
 const sync=()=>{
  const single=mode.value==="single";if(single)amountMode.value="same";const same=amountMode.value==="same";
  $('manualSingleCardField').classList.toggle('hidden',!single);
  $('manualBulkCardsField').classList.toggle('hidden',single);
  $('manualChargeAmountMode').disabled=single;
  $('manualSameAmountField').classList.toggle('hidden',!same);
  if(!single&&!same)$('manualBulkCards').placeholder="MZ-07-001-005-001/389, 850\nMZ-07-001-005-001/390, 1250, 2026-11-10";
 };
 mode.addEventListener('change',sync);amountMode.addEventListener('change',sync);sync();
 $('cancelManualCharges').addEventListener('click',closeCitizenDetail);
 $('previewManualCharges').addEventListener('click',()=>{
  const single=mode.value==="single",same=amountMode.value==="same",date=$('manualChargeDate').value;
  const raw=single?$('manualSingleCard').value.trim():$('manualBulkCards').value.trim();
  const rows=[],errors=[];
  if(!date){errors.push("Choose a default entry date.");}
  if(!raw){errors.push(single?"Enter a job card number.":"Paste at least one job card number.");}
  const sharedAmount=same?Number($('manualSameAmount').value):null;
  if(same&&(!Number.isFinite(sharedAmount)||sharedAmount<=0||sharedAmount>10000000))errors.push("Enter a valid positive amount.");
  const lines=single?[raw]:raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const seen=new Set();
  for(let i=0;i<lines.length;i++){
   const parts=single?[lines[i]]:lines[i].split(/[,\t]/).map(x=>x.trim());
   const card=parts[0]||"";
   if(i===0&&/^(job card|jobcard|job card number)$/i.test(card))continue;
   const amount=same?sharedAmount:Number(parts[1]);
   const rowDate=(!same&&parts[2])?parts[2]:null;
   if(!card||card.length>100){errors.push("Line "+(i+1)+": invalid job card number.");continue;}
   if(seen.has(card)){errors.push("Duplicate job card: "+card);continue;}seen.add(card);
   if(!Number.isFinite(amount)||amount<=0||amount>10000000){errors.push("Line "+(i+1)+": invalid amount.");continue;}
   if(rowDate&&!/^\d{4}-\d{2}-\d{2}$/.test(rowDate)){errors.push("Line "+(i+1)+": date must be YYYY-MM-DD.");continue;}
   rows.push({job_card_number:card,amount,entry_date:rowDate||date});
  }
  const box=$('manualChargePreview');
  if(errors.length){box.innerHTML='<div class="notice err">'+errors.slice(0,8).map(esc).join('<br>')+(errors.length>8?'<br>And '+(errors.length-8)+' more issue(s).':'')+'</div>';return;}
  if(!rows.length||rows.length>500){box.innerHTML='<div class="notice err">Enter between 1 and 500 valid job cards.</div>';return;}
  const total=rows.reduce((sum,row)=>sum+row.amount,0);
  const period=periods.find(p=>String(p.id)===$('manualChargePeriod').value);
  box.innerHTML='<div class="notice info">Review: <b>'+rows.length+' job card(s)</b> · total <b>'+fmt(total)+'</b> · '+esc($('manualChargeKind').value==='extra'?'Extra':'Regular')+' · '+esc(period?.period_name||'Contribution round')+'.</div>'+
   '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th>Job card</th><th>Entry date</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+rows.map(row=>'<tr><td>'+esc(row.job_card_number)+'</td><td>'+esc(row.entry_date)+'</td><td style="text-align:right">'+fmt(row.amount)+'</td></tr>').join('')+'</tbody></table></div>'+
   '<button class="btn" id="saveManualCharges" type="button">Save '+rows.length+' charge(s)</button>';
  $('saveManualCharges').addEventListener('click',async()=>{
   if(busy)return;
   const reason=$('manualChargeReason').value.trim(),periodId=$('manualChargePeriod').value,selected=periods.find(p=>String(p.id)===periodId);
   const month=String(selected?.contribution_month||selected?.period_date||'').slice(0,7);
   if(!reason){status("Enter a reason or reference.","error");$('manualChargeReason').focus();return;}
   if(!/^\d{4}-\d{2}$/.test(month)){status("The selected contribution round has no valid month.","error");return;}
   busy=true;$('saveManualCharges').disabled=true;$('saveManualCharges').textContent="Saving…";
   try{
    const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:'save-manual-contribution-charges',entries:rows,charge_kind:$('manualChargeKind').value,period_id:periodId,charge_period:month+'-01',entry_date:date,reason},timeoutMs:false});
    if(error||!data||data.approved!==true||data.error)throw new Error((data&&data.error)||(error&&error.message)||"Could not save manual charges.");
    $('overlay').classList.add('hidden');
    busy=false;
    await load();
    status(data.count+" manual charge(s) saved. Total "+fmt(data.total_amount)+".","success");
   }catch(err){status(err.message||"Could not save manual charges.","error");}
   finally{busy=false;if($('saveManualCharges')){$('saveManualCharges').disabled=false;$('saveManualCharges').textContent="Save "+rows.length+" charge(s)";}}
  });
 });
}

function showBulkPaymentForm(){
 $('overlay').classList.remove('hidden');
 $('sheetFooter').classList.add('hidden');
 if(appRole!=="admin"){status("Only an approved administrator can register bulk bank payments.","err");return;}
 $('sheetTitle').textContent="Bulk bank payments";
 $('sheetSubtitle').textContent='';
 $('sheetFooter').classList.add('hidden');
 $('toggleEditMode').classList.add('hidden');
 $('sheetBody').innerHTML='<div class="notice info">Register bank payments for multiple job cards in one batch. Every saved entry will be tagged <b>Bank</b>. Paste one job card and amount per line, separated by a comma or tab. Maximum 500 payments per batch.</div><div class="field"><label for="bulkPaymentDate">Payment date for this batch</label><input id="bulkPaymentDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label for="bulkPaymentRows">Job card number, amount</label><textarea id="bulkPaymentRows" rows="8" style="width:100%;padding:12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;resize:vertical" placeholder="MZ-07-001-005-001/389,1240&#10;MZ-07-001-005-002/390,850"></textarea><p class="muted">A header row such as Job Card, Amount is allowed. Duplicate job cards are rejected to prevent accidental double entry.</p></div><button class="btn" id="previewBulkPayments" type="button">Preview batch</button> <button class="btn ghost" id="cancelBulkPayments" type="button">Cancel</button><div id="bulkPaymentPreview"></div>';

 $('previewBulkPayments').addEventListener('click',()=>{

  $('editBulkPayments').addEventListener('click',()=>{$('bulkPaymentPreview').innerHTML='';});
  $('saveBulkPayments').addEventListener('click',async()=>{
   if(busy)return;
   if(!window.confirm('Save '+parsed.rows.length+' Bank payment entries totalling '+fmt(total)+'?'))return;
   busy=true;$('saveBulkPayments').disabled=true;$('saveBulkPayments').textContent='Saving batch…';
   try{
    const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:"bulk-bank-payment",entry_date:date,entries:parsed.rows},timeoutMs:false});
    if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save bank payment batch.');
    entries.push(...(data.entries||[]));deriveCitizens();render();$('overlay').classList.add('hidden');
    status('Saved '+data.count+' Bank payments totalling '+fmt(data.total_amount)+'. Ledger updated.','success');
   }catch(err){status(err.message||'Could not save bank payment batch.','error');if($('saveBulkPayments')){$('saveBulkPayments').disabled=false;$('saveBulkPayments').textContent='Save '+parsed.rows.length+' bank payments';}}
   finally{busy=false;}
  });
 });
}

function updateEntryInMemory(entry){
 const index=entries.findIndex(e=>String(e.id)===String(entry.id));
 if(index>=0)entries[index]=entry;else entries.push(entry);
 deriveCitizens();render();
}
function showEditForm(id){
 $('sheetFooter').classList.add('hidden');
 const c=currentCitizen;if(!c)return;
 const e=c.ledger.find(row=>String(row.id)===String(id));if(!e)return;
 if(e.entry_type==="charge"&&/^FTO(?:\s|:|-|$)/i.test(String(e.note||"").trim())){status('FTO-imported charges must be revised through the FTO workflow.','error');return;}
 const isCharge=e.entry_type==="charge"&&String(e.note||"").trim().toLowerCase()!=="return";
 const typeLabel=(e.entry_type==="charge_waiver"||e.entry_type==="forgive")?"Charge Waiver":e.entry_type==="payment"?"Payment":(e.entry_type==="refund"||e.entry_type==="return")?"Refund":(e.entry_type==="other_charge"||e.entry_type==="sanitationFee")?"Other Charge":"Charge";
 $('sheetBody').innerHTML='<div class="notice info">Editing '+esc(typeLabel)+'. Original and revised values will be recorded in the audit log.</div><form id="editEntryForm"><div class="field"><label for="editAmount">Amount (₹)</label><input id="editAmount" type="number" min="0.01" max="10000000" step="0.01" required value="'+esc(e.amount)+'"></div><div class="grid2"><div class="field"><label for="editDate">Transaction date</label><input id="editDate" type="date" required value="'+esc(String(e.entry_date||new Date().toISOString().slice(0,10)).slice(0,10))+'"></div><div class="field"><label for="editNote">Note</label><input id="editNote" maxlength="200" value="'+esc(e.note||"")+'" placeholder="Optional note"></div></div>'+(isCharge?'<div class="field"><label for="editPeriod">Charge month</label><input id="editPeriod" type="month" required value="'+esc(String(e.charge_period||"").slice(0,7))+'"></div><div class="field"><label><input id="editDeferred" type="checkbox" '+(e.is_deferred?'checked':'')+' style="width:auto;min-height:0;margin-right:8px"> Deferred charge</label></div>':'')+'<button class="btn" id="saveEdit" type="submit">Save changes</button> <button class="btn ghost" id="cancelEdit" type="button">Cancel</button></form>';
 $('cancelEdit').addEventListener('click',()=>openCitizen(c.id));
 $('editEntryForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const payload={action:"edit-ledger-entry",id:e.id,amount:Number($('editAmount').value),entry_date:$('editDate').value,note:$('editNote').value};
  if(isCharge){const month=$('editPeriod').value;payload.charge_period=month?month+'-01':'';payload.is_deferred=$('editDeferred').checked;}
  if(!Number.isFinite(payload.amount)||payload.amount<=0){status('Enter an amount greater than zero.','error');return;}
  busy=true;$('saveEdit').disabled=true;$('saveEdit').textContent='Saving…';
  try{
   const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:payload,timeoutMs:false});
   if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not edit transaction.');
   updateEntryInMemory(data.entry);openCitizen(c.id);status('Transaction updated. Original and revised values were logged.','success');
  }catch(err){status(err.message||'Could not edit transaction.','error');}
  finally{busy=false;if($('saveEdit')){$('saveEdit').disabled=false;$('saveEdit').textContent='Save changes';}}
 });
}
function showAdjustmentForm(action){
 $('sheetFooter').classList.add('hidden');
 const c=currentCitizen;if(!c)return;
 const isWaiver=action==="add-waiver",title=isWaiver?"Charge Waiver":"Refund";
 $('sheetBody').innerHTML='<div class="notice info">'+(isWaiver?'A waiver reduces the outstanding balance and is recorded as a separate ledger entry.':'A refund records money returned to the household and increases the outstanding balance.')+'</div><form id="adjustmentForm"><div class="field"><label for="adjustAmount">Amount (₹)</label><input id="adjustAmount" type="number" min="0.01" max="' +(isWaiver?Number(c.balance).toFixed(2):10000000)+'" step="0.01" required inputmode="decimal"></div><div class="grid2"><div class="field"><label for="adjustDate">Date</label><input id="adjustDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label for="adjustNote">Note</label><input id="adjustNote" maxlength="200" value="'+(isWaiver?'Charge Waiver':'Refund')+'"></div></div><button class="btn" id="saveAdjustment" type="submit">'+title+'</button> <button class="btn ghost" id="cancelAdjustment" type="button">Cancel</button></form>';
 $('cancelAdjustment').addEventListener('click',()=>openCitizen(c.id));
 $('adjustmentForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const amount=Number($('adjustAmount').value),date=$('adjustDate').value,note=$('adjustNote').value;
  if(!Number.isFinite(amount)||amount<=0){status('Enter an amount greater than zero.','error');return;}if(isWaiver&&amount>Number(c.balance)+0.001){status('Waiver cannot exceed the current outstanding balance.','error');return;}
  busy=true;$('saveAdjustment').disabled=true;$('saveAdjustment').textContent='Saving…';
  try{
   const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action,job_card_number:c.id,amount,entry_date:date,note},timeoutMs:false});
   if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save adjustment.');
   updateEntryInMemory(data.entry);openCitizen(c.id);status((isWaiver?'Charge Waiver':'Refund')+' recorded and ledger recalculated.','success');
  }catch(err){status(err.message||'Could not save adjustment.','err');}
  finally{busy=false;if($('saveAdjustment')){$('saveAdjustment').disabled=false;$('saveAdjustment').textContent=title;}}
 });
}
async function payInFull(){
 const c=currentCitizen;if(!c||busy||c.balance<=0)return;
 if(!window.confirm('Record a payment of '+fmt(c.balance)+' to settle this job card?'))return;
 busy=true;
 try{
  const {data,error}=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:"pay-in-full",job_card_number:c.id,entry_date:new Date().toISOString().slice(0,10)},timeoutMs:false});
  if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not record full payment.');
  // Reload the affected job-card summary from PostgreSQL, then refresh the main
  // contribution table and KPIs. This is deliberately independent of the history modal.
  const refreshed=await window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:'job-card-details',job_card_number:c.id},timeoutMs:false});
  if(refreshed.error||!refreshed.data||refreshed.data.error||!refreshed.data.card_summary)throw new Error((refreshed.data&&refreshed.data.error)||(refreshed.error&&refreshed.error.message)||'Payment was recorded, but the contribution table could not be refreshed. Reload the page to verify the latest balance.');
  summaryByCard.set(String(c.id),refreshed.data.card_summary);
  entries=entries.filter(row=>String(row.job_card_number)!==String(c.id)).concat(refreshed.data.entries||[]);
  deriveCitizens();
  render();
  currentCitizen=citizens.find(item=>item.id===c.id)||c;
  status('Full payment recorded. Contribution table updated.','success');
 }catch(err){status(err.message||'Could not record full payment.','err');}
 finally{busy=false;}
}

async function load(){
 if(busy)return;
 if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Checking sign-in session…');
 try{
  status('Restoring your sign-in session…');
  // Never leave the page on its initial account-check message if session storage stalls.
  const sessionResult=await Promise.race([
   supabaseClient.auth.getSession(),
   new Promise((_,reject)=>window.setTimeout(()=>reject(new Error('Session check timed out. Return to the main menu, sign in again, then reopen Contribution.')),12000))
  ]);
  const {data:sessionData,error:sessionError}=sessionResult;
  if(sessionError||!sessionData.session){status('Sign in from the VBGRAMG home page first.');$('app').classList.add('hidden');return;}
  // The protected list action independently validates the verified session and approved-user record.
  // Avoid a redundant access-function network round trip during startup.
  status('Loading active MIS and contribution ledger…');
  if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Requesting Contribution data from server…');
  // The list endpoint reads the active MIS, ledger, allocations and FTO attribution.
  // Bound startup wait so a stalled request cannot leave the page loading indefinitely.
  let listTimer;
  let listResult;
  const requestStarted=performance.now();
  try{
   listResult=await Promise.race([
    window.VBGRAMGData.invoke('vbgramg-contribution-data',{body:{action:'list-summary'},deduplicate:true,timeoutMs:45000}),
    new Promise((_,reject)=>{listTimer=window.setTimeout(()=>reject(new Error('Contribution data request timed out after 45 seconds. Check your connection and retry. If this continues, report the time of the failure so the server request can be investigated.')),45000);})
   ]);
  }finally{if(listTimer)window.clearTimeout(listTimer);}
  recordStartupStage('list_invoke_network_plus_json_parse_ms',requestStarted);
  if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Contribution data received. Processing job cards…');
  const {data,error}=listResult;
  if(error||!data||data.approved!==true||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not load contribution data.');
  if(window.VBGRAMGCache)window.VBGRAMGCache.setUser(sessionData.session.user.id);
  const assignmentStarted=performance.now();
  appRole=String(data.role||"");periods=Array.isArray(data.periods)?data.periods:[];$("manualChargeBtn").classList.toggle("hidden",appRole!=="admin");$("bulkPaymentBtn").classList.toggle("hidden",appRole!=="admin");$("manageExemptionsBtn").classList.toggle("hidden",appRole!=="admin");$("auditHistoryBtn").classList.toggle("hidden",appRole!=="admin");$("exportDueBtn").classList.remove("hidden");entries=[];summaryByCard=new Map((data.summaries||[]).map(row=>[String(row.job_card_number||'').trim(),row]));paymentAllocations=[];paymentRefundReconciliations=[];extraCharges=[];citizenRegistry=(data.summaries||[]).map(row=>({job_card_number:row.job_card_number,person_name:row.person_name}));applicantsByCard=data.applicants_by_job_card||{};exemptions=data.exemptions||[];
  recordStartupStage("assign_response_data_ms",assignmentStarted);
  if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Building contribution summaries…');
  const deriveStarted=performance.now();deriveCitizens();recordStartupStage("derive_citizens_total_ms",deriveStarted);renderExemptions();
  if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Rendering Contribution table…');
  $('app').classList.remove('hidden');$('status').classList.add('hidden');$('loading-state').classList.add('hidden');
  const firstRenderStarted=performance.now();
  render();
  recordStartupStage('first_render_call_ms',firstRenderStarted);
  publishStartupTiming();
 }catch(err){
  $('app').classList.add('hidden');$('loading-state').classList.add('hidden');
  const node=$('status');
  const message=err&&err.message?err.message:'Could not load contribution data.';
  if(window.VBGRAMG_CONTRIBUTION_STAGE)window.VBGRAMG_CONTRIBUTION_STAGE('Startup failed: '+message);
  if(window.showToast)window.showToast(message,'error',8000);
  if(node){
   node.className='notice info';
   node.replaceChildren();
   const retry=document.createElement('button');
   retry.type='button';retry.className='btn ghost small';retry.textContent='Retry loading';
   retry.addEventListener('click',()=>{retry.disabled=true;retry.textContent='Retrying…';load().finally(()=>{retry.disabled=false;retry.textContent='Retry loading';});});
   node.appendChild(retry);node.classList.remove('hidden');
  }
 }
}

function closeCitizenDetail(){
 citizenDetailRequest++;
 $('overlay').classList.add('hidden');
 currentCitizen=null;
 document.querySelectorAll('#contribution-table tbody tr').forEach(row=>row.classList.remove('selected'));
 const opener=citizenDialogOpener;
 citizenDialogOpener=null;

document.addEventListener('keydown',ev=>{
 const overlay=$('overlay');
 if(!overlay||overlay.classList.contains('hidden'))return;
 if(ev.key==='Escape'){ev.preventDefault();closeCitizenDetail();return;}
 if(ev.key!=='Tab')return;
 const sheet=overlay.querySelector('.sheet');
 if(!sheet)return;
 const focusable=Array.from(sheet.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(el=>el.getClientRects().length&&!el.closest('.hidden'));
 if(!focusable.length){ev.preventDefault();sheet.setAttribute('tabindex','-1');sheet.focus();return;}
 const first=focusable[0],last=focusable[focusable.length-1];
 if(ev.shiftKey&&(document.activeElement===first||!sheet.contains(document.activeElement))){ev.preventDefault();last.focus();}
 else if(!ev.shiftKey&&(document.activeElement===last||!sheet.contains(document.activeElement))){ev.preventDefault();first.focus();}
});

supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session){$('app').classList.add('hidden');status('Sign in from the VBGRAMG home page first.');}});
load().catch(err=>setStartupError(err&&err.message?err.message:'Could not start the Contribution page.'));
})().catch(err=>{
 const loading=document.getElementById('loading-state');
