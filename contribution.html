<style>

.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:18px 22px;margin:0 auto 18px;flex-wrap:wrap}
.brand h1{font-size:1.45rem;letter-spacing:-.035em;margin:0;color:var(--ink)}.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}.brand a{color:inherit;text-decoration:none}.brand a:hover{text-decoration:underline}

.btn{font:inherit;font-size:.9rem;font-weight:650;border:1px solid transparent;border-radius:10px;min-height:42px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.btn:hover{background:#2c3b55}.btn.ghost{background:#f0f3f8;color:#344054;border-color:#e0e6ef}.btn.ghost:hover{background:#e6ebf3}.btn.small{min-height:40px;padding:9px 13px;font-size:.88rem}.btn:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}.btn:disabled{opacity:.48;cursor:not-allowed}
.panel{padding:clamp(18px,2.5vw,28px);margin-bottom:16px}.panel h1{font-size:1.18rem;margin:0 0 6px;letter-spacing:-.02em}.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}

.toolbar{display:flex;gap:10px;align-items:end;margin:0 0 14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;min-height:44px;padding:10px 12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;outline:0;background:#fff;color:var(--ink)}.toolbar input:focus,.field input:focus,.field select:focus,.toolbar select:focus{outline:3px solid rgb(36 87 197 / 15%);border-color:#6f91dc}.filter-control{min-width:170px}.filter-control label{display:block;font-size:.82rem;font-weight:650;color:#344054;margin:0 0 6px}.filter-control select{width:100%;min-height:44px;padding:10px 12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;background:#fff;color:var(--ink)}
.table-wrap{overflow:auto;overscroll-behavior:contain;max-height:68vh;border:1px solid #dfe5ee;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgb(23 32 51 / 3%)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem;white-space:normal}thead th{position:sticky;top:0;z-index:1;background:#edf2f8;color:#475467;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:750;white-space:nowrap}th,td{padding:12px 14px;border-bottom:1px solid #e8edf4}tbody tr:last-child td{border-bottom:0}.contribution-row{background:#fff;cursor:pointer;transition:background .15s}.contribution-row.settled{box-shadow:inset 3px 0 #16a34a}.contribution-row.due{box-shadow:inset 3px 0 #e9a23b}.contribution-row:hover{background:#f6f9ff}.contribution-row:focus-visible{outline:2px solid #3972df;outline-offset:-2px}.contribution-row td:first-child{color:#667085;width:64px}.contribution-row .jobcard{font-weight:700;white-space:nowrap}.contribution-row .person{font-weight:650}.contribution-row .amount,.contribution-row .balance{font-weight:750;white-space:nowrap;text-align:right}.contribution-row .status-cell{white-space:nowrap}.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.table-foot .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{font-size:.84rem;color:var(--muted);line-height:1.45}
.citizen{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--surface);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}.citizen:hover{background:#f6f9ff;border-color:#cbd8f0}.citizen:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}.citizen .info{flex:1;min-width:0}.citizen .info b{font-size:.93rem;display:block;font-weight:700;color:var(--ink)}.citizen .info small{font-size:.8rem;color:var(--muted);display:block;margin-top:3px;overflow-wrap:anywhere}.citizen .bal{font-size:.95rem;font-weight:750;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;flex:none}.dot.paid{background:var(--paid)}.dot.partial{background:var(--partial)}.dot.due{background:var(--due)}
.badge{display:inline-flex;font-size:.66rem;font-weight:750;padding:4px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}.badge.paid{background:#e6f4ea;color:var(--paid)}.badge.partial{background:#fdf1e3;color:var(--partial)}.badge.due{background:#fdeaea;color:var(--due)}
.notice{padding:11px 13px;border:1px solid #e5eaf2;border-radius:10px;background:#f7f9fc;color:#475467;font-size:.88rem;line-height:1.45;margin:0 0 16px;overflow-wrap:anywhere}.notice.err{background:#fff4f2;border-color:#ffd8d2;color:#a12b20}.notice.info{background:#f7f9fc;border-color:#e5eaf2;color:#475467}.hidden{display:none!important}.empty{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}.count{color:var(--muted);font-size:.84rem;margin:0 0 10px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 16px 50px rgb(15 23 42 / 18%)}.sheet-head{position:sticky;top:0;background:var(--surface);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}.sheet-head h2{margin:0;font-size:1.05rem}.x{background:#f0f3f8;border:1px solid #e0e6ef;width:36px;height:36px;border-radius:10px;font-size:19px;color:#475467;cursor:pointer}.sheet-body{padding:18px}.balance{padding:20px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);margin-bottom:14px}.balance .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.balance .amount{font-size:clamp(30px,5vw,38px);font-weight:800;letter-spacing:-1px;margin:3px 0}.balance .amount.owing{color:var(--due)}.balance .amount.zero{color:var(--paid)}
.split{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}.split>div{flex:1;padding:12px;text-align:center;min-width:0}.split>div+div{border-left:1px solid var(--line)}.split .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.split .v{font-size:.95rem;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;margin:18px 0 8px}.entry{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f5}.entry:last-child{border-bottom:0}.entry .desc{flex:1;min-width:0}.entry .desc b{display:block;font-size:.88rem;overflow-wrap:anywhere}.entry .desc small{color:var(--muted);font-size:.76rem}.entry .amt{font-size:.9rem;font-weight:750;white-space:nowrap}.entry .amt.payment{color:var(--paid)}.entry .entry-actions{display:flex;gap:5px;align-items:center;flex:none}.entry .entry-actions .btn{min-height:32px;padding:5px 8px;font-size:.75rem}.transaction-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.transaction-actions .btn{min-height:38px;padding:8px 12px}
.field{margin-bottom:12px}.field label{display:block;font-size:.82rem;font-weight:650;color:#344054;margin-bottom:6px}.field input,.field select{width:100%;min-height:44px;padding:10px 12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;background:#fff;outline:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px}
@media(min-width:900px){.overlay{align-items:center;padding:20px}.sheet{border-radius:16px;max-height:88vh}}
@media(max-width:700px){body{padding:10px}.topbar{padding:15px;gap:14px;border-radius:13px;margin-bottom:12px}.brand h1{font-size:1.3rem}.top-actions{width:100%;justify-content:flex-start;gap:8px}.panel{padding:14px;border-radius:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat{padding:11px 12px;border-radius:10px}.stat .k{font-size:.74rem;margin-bottom:5px}.stat .v{font-size:1rem}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.toolbar input{min-width:0;width:100%;grid-column:1/-1}.filter-control{min-width:0;width:100%}.filter-control select{min-width:0}.citizen{padding:12px 10px;gap:8px}.citizen .bal{font-size:.88rem}.grid2{grid-template-columns:1fr}.split>div{padding:10px 6px}.split .k{font-size:.61rem}.split .v{font-size:.84rem}.sheet-body{padding:14px}}
@media(max-width:360px){body{padding:7px}.panel{padding:11px}.topbar{padding:12px}.citizen{padding:10px 8px}.citizen .info b{font-size:.86rem}.citizen .info small{font-size:.73rem}.badge{font-size:.6rem;padding:3px 6px}.split .v{font-size:.78rem}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><h1>Contribution</h1><p><a href="./">← Main menu</a></p></div><div class="top-actions"><button class="btn hidden" id="bulkPaymentBtn" type="button">Bulk bank payment</button><button class="btn ghost small" id="refreshBtn" type="button">Refresh</button></div></header>
<main>
<section class="panel"><div id="status" class="notice info">Checking your approved account…</div></section>
<div id="app" class="hidden">
<section class="panel">
<div class="stats"><div class="stat"><div class="k">Outstanding</div><div class="v due" id="outstanding">—</div></div><div class="stat"><div class="k">Deferred total</div><div class="v" id="deferred">—</div></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search name or full job card number" autocomplete="off"><div class="filter-control"><label for="statusFilter">Contribution status</label><select id="statusFilter"><option value="all">All job cards</option><option value="due" selected>Due</option><option value="paid">Settled</option><option value="deferred">Has deferred charges</option></select></div><button id="clearSearch" class="btn ghost" type="button">Clear</button></div><p id="count" class="count"></p><div id="table-wrap" class="table-wrap"><table id="contribution-table"><thead></thead><tbody></tbody></table></div><div id="empty" class="empty hidden">No matching job cards found.</div><div class="table-foot"><span id="page-label" class="muted"></span><div class="actions"><button id="prev-button" class="btn ghost" type="button">Previous</button><button id="next-button" class="btn ghost" type="button">Next</button></div></div>
</section>
</div>
</main>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Contribution statement</h2><button class="x" id="closeSheet" aria-label="Close">×</button></div><div id="sheetBody" class="sheet-body"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let entries=[], citizens=[], citizenRegistry=[], currentCitizen=null, busy=false, currentPage=0, pageSize=50, appRole="";
const fmt=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Date not recorded';
const formatPeriod=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})/);if(!m)return s||'Monthly charge';const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const n=Number(m[2]);return n>=1&&n<=12?months[n-1]+' '+m[1]:(s||'Monthly charge')};
function status(message,type='info'){ $('status').className='notice '+(type==='err'?'err':'info');$('status').textContent=message; }
function calculateLedgerState(ledger){
 let charged=0,paid=0,returned=0,waived=0,deferred=0;const active=[];
 for(const e of ledger||[]){if(!e)continue;const n=Math.max(0,Number(e.amount)||0),t=e.entry_type;
  if(t==='payment'){paid+=n;continue}
  if(t==='return'||(t==='charge'&&String(e.note||'').trim()==='Return')){returned+=n;continue}
  if(t==='forgive'){waived+=n;continue}
  if(t!=='charge'&&t!=='sanitationFee')continue;
  if(e.is_deferred){deferred+=n;continue}
  charged+=n;active.push(n);
 }
 let credit=Math.min(waived,charged);for(let i=0;i<active.length&&credit>0;i++){const x=Math.min(credit,active[i]);active[i]-=x;credit-=x}
 return {charged,paid,returned,waived,deferred,balance:active.reduce((sum,n)=>sum+n,0)-paid+returned};
}
function deriveCitizens(){
 const map=new Map(),make=(id,name)=>({id,jobCard:id,name:name||'Unnamed',charges:0,activeCharges:0,deferred:0,paid:0,waived:0,returns:0,ledger:[]});
 for(const r of citizenRegistry){const id=String(r.job_card_number||'').trim();if(id)map.set(id,make(id,r.person_name))}
 for(const e of entries){const id=String(e.job_card_number||'').trim();if(!id||!map.has(id))continue;map.get(id).ledger.push(e)}
 citizens=[...map.values()].map(c=>{const x=calculateLedgerState(c.ledger);let gross=0;for(const e of c.ledger){if((e.entry_type==='charge'||e.entry_type==='sanitationFee')&&!(e.entry_type==='charge'&&String(e.note||'').trim()==='Return'))gross+=Math.max(0,Number(e.amount)||0)}return {...c,charges:gross,activeCharges:x.charged,deferred:x.deferred,paid:x.paid,waived:x.waived,returns:x.returned,totalCharged:Math.max(0,gross-Math.min(gross,x.waived)),balance:x.balance}}).sort((a,b)=>a.name.localeCompare(b.name)||a.id.localeCompare(b.id));
}
function jobCardSuffixNumber(jobCard){
 const match=String(jobCard||'').match(/\/([^/]+)$/);
 if(!match)return Number.POSITIVE_INFINITY;
 const n=Number(match[1].trim());
 return Number.isFinite(n)?n:Number.POSITIVE_INFINITY;
}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase(),filter=$('statusFilter').value;
 const list=citizens.filter(c=>{
  const state=c.balance<=0?'paid':'due';
  const matchesStatus=filter==='all'||(filter==='deferred'?c.deferred>0:state===filter);
  const matchesSearch=c.name.toLocaleLowerCase().includes(q)||c.id.toLocaleLowerCase().includes(q);
  return matchesStatus&&matchesSearch;
 }).sort((a,b)=>jobCardSuffixNumber(a.id)-jobCardSuffixNumber(b.id)||a.id.localeCompare(b.id,undefined,{numeric:true})||a.name.localeCompare(b.name));
 $('outstanding').textContent=fmt(citizens.reduce((s,c)=>s+Math.max(0,c.balance),0));
 $('deferred').textContent=fmt(citizens.reduce((s,c)=>s+c.deferred,0));
 const totalPages=Math.max(1,Math.ceil(list.length/pageSize));currentPage=Math.min(currentPage,totalPages-1);
 const start=currentPage*pageSize,shown=list.slice(start,start+pageSize),isMobile=window.matchMedia('(max-width: 700px)').matches;
 const thead=$('contribution-table').querySelector('thead'),tbody=$('contribution-table').querySelector('tbody');thead.replaceChildren();tbody.replaceChildren();
 const head=document.createElement('tr');
 (isMobile?['Job Card Details']:['Job Card Number','Head of Household','Outstanding']).forEach(label=>{const th=document.createElement('th');th.textContent=label;head.appendChild(th)});thead.appendChild(head);
 shown.forEach((c,index)=>{
  const state=c.balance<=0?'settled':'due',tr=document.createElement('tr');tr.className='contribution-row '+state;tr.tabIndex=0;tr.dataset.card=c.id;tr.setAttribute('role','button');tr.setAttribute('aria-label','Open contribution history for '+c.name+' job card '+c.id);
  const cell=(value,cls)=>{const td=document.createElement('td');td.textContent=value;if(cls)td.className=cls;tr.appendChild(td);return td};
  if(isMobile){
   const detail=cell('','');const number=document.createElement('div');number.textContent=c.id;number.className='jobcard';number.style.whiteSpace='normal';number.style.overflowWrap='anywhere';detail.appendChild(number);
   const secondary=document.createElement('div');secondary.className='mobile-secondary';secondary.style.cssText='display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:.8rem;color:#64748b;font-weight:400';
   const name=document.createElement('span');name.textContent=c.name;secondary.appendChild(name);
   const balance=document.createElement('span');if(c.balance>0){balance.textContent='Outstanding: '+fmt(c.balance);secondary.appendChild(balance);}
   detail.appendChild(secondary);
  }else{
   cell(c.id,'jobcard');cell(c.name,'person');cell(c.balance>0?fmt(c.balance):'','balance');
  }
  tr.addEventListener('click',()=>openCitizen(c.id));tr.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openCitizen(c.id)}});tbody.appendChild(tr);
 });
 $('table-wrap').classList.toggle('hidden',list.length===0);$('empty').classList.toggle('hidden',list.length!==0);
 $('count').textContent=list.length.toLocaleString('en-IN')+' job card'+(list.length===1?'':'s')+' matching filters';
 $('page-label').textContent=list.length?'Showing '+(start+1)+'–'+Math.min(start+pageSize,list.length)+' of '+list.length:'No matching job cards';
 $('prev-button').disabled=currentPage<=0;$('next-button').disabled=currentPage>=totalPages-1;
}
function openCitizen(id){
 currentCitizen=citizens.find(c=>c.id===id);if(!currentCitizen)return;
 const c=currentCitizen;
 $('sheetTitle').textContent=c.name;
 const chronological=[...c.ledger].sort((a,b)=>(a.entry_date||'').localeCompare(b.entry_date||'')||(a.created_at||'').localeCompare(b.created_at||''));
 const periodChargeCounts=new Map(),periodChargeIndexes=new Map(),chargeOccurrenceIndex=new Map();
 for(const e of chronological){
  if(e.entry_type==='charge'&&e.charge_period){
   periodChargeCounts.set(e.charge_period,(periodChargeCounts.get(e.charge_period)||0)+1);
   const next=(periodChargeIndexes.get(e.charge_period)||0)+1;
   periodChargeIndexes.set(e.charge_period,next);
   chargeOccurrenceIndex.set(e,next);
  }
 }
 const sorted=[...chronological].reverse();
 const lines=sorted.map(e=>{
  const type=e.entry_type, amount=Number(e.amount)||0, isPayment=type==='payment';
  let chargeTag=String(e.note||'').trim()|| (e.charge_period?formatPeriod(e.charge_period):'Monthly charge');
  // Display concise charge tags and preserve an existing duplicate number.
  if(type==='charge'){
   chargeTag=chargeTag.replace(/^MAY26(?=\(\d+\)$)/i,'MAY').replace(/^MAY26$/i,'MAY');
   chargeTag=chargeTag.replace(/^JAN-26$/i,'JAN26').replace(/^FEB-26$/i,'FEB26').replace(/^MAR-26$/i,'MAR26').replace(/^APR-26$/i,'APR26').replace(/^JUN-26$/i,'JUN26').replace(/^JUL-26$/i,'JUL26').replace(/^AUG-26$/i,'AUG26').replace(/^SEP-26$/i,'SEP26').replace(/^OCT-26$/i,'OCT26').replace(/^NOV-26$/i,'NOV26').replace(/^DEC-26$/i,'DEC26');
  }
  let periodLabel=chargeTag;
  if(type==='charge'&&e.charge_period&&(periodChargeCounts.get(e.charge_period)||0)>1&&!/\(\d+\)$/.test(chargeTag)){
   periodLabel+='('+chargeOccurrenceIndex.get(e)+')';
  }
  const label=type==='charge'?'Charges • '+periodLabel+(e.is_deferred?' • Deferred':''):type==='sanitationFee'?'Sanitation fee':type==='payment'?'Payment':type==='forgive'?'Waiver':type==='return'?'Return':type;
  const noteText=String(e.note||'').trim();
  const looksLikePeriod=/^(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)(\s*[-/]?\s*\d{0,4})?$/i.test(noteText)||/^MAY\s*1$/i.test(noteText)||/^MAY1$/i.test(noteText);
  const displayNote=type==='payment'&&looksLikePeriod?'':noteText;
  const transactionDate=String(e.entry_date||'').slice(0,10)>='2026-06-01'?day(e.entry_date):'';
  return '<div class="entry"><div class="desc"><b>'+esc(label)+(type!=='charge'&&displayNote?' · '+esc(displayNote):'')+'</b>'+(transactionDate?'<small>'+esc(transactionDate)+'</small>':'')+'</div><div class="amt '+(isPayment?'payment':'')+'">'+(isPayment?'−':'')+fmt(amount)+'</div>'+(appRole==='admin'?'<div class="entry-actions"><button class="btn ghost small" type="button" data-edit-entry="'+esc(e.id)+'">Edit</button></div>':'')+'</div>';
 }).join('');

function parseBulkPayments(raw){
 const rows=[],errors=[],seen=new Set();
 const lines=String(raw||"").split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();if(!line)continue;
  if(i===0&&/job.?card/i.test(line)&&/amount/i.test(line))continue;
  const parts=line.split(/\t|,|;/).map(v=>v.trim());
  if(parts.length<2){errors.push('Line '+(i+1)+': use Job Card, Amount.');continue;}
  const jobCard=parts[0],amount=Number(parts[1].replace(/[₹,\s]/g,""));
  if(!jobCard){errors.push('Line '+(i+1)+': job card number is missing.');continue;}
  if(!Number.isFinite(amount)||amount<=0||amount>10000000){errors.push('Line '+(i+1)+': enter a valid positive amount.');continue;}
  if(seen.has(jobCard)){errors.push('Line '+(i+1)+': duplicate job card '+jobCard+'.');continue;}
  seen.add(jobCard);rows.push({job_card_number:jobCard,amount});
 }
 if(!rows.length&&!errors.length)errors.push('Paste at least one job card and amount.');
 if(rows.length>500)errors.push('A batch can contain at most 500 payments.');
 return {rows,errors};
}
function showBulkPaymentForm(){
 if(appRole!=="admin"){status("Only an approved administrator can register bulk bank payments.","err");return;}
 $('sheetTitle').textContent="Bulk bank payments";
 $('sheetBody').innerHTML='<div class="notice info">Register bank payments for multiple job cards in one batch. Every saved entry will be tagged <b>Bank</b>. Paste one job card and amount per line, separated by a comma or tab. Maximum 500 payments per batch.</div><div class="field"><label for="bulkPaymentDate">Payment date for this batch</label><input id="bulkPaymentDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label for="bulkPaymentRows">Job card number, amount</label><textarea id="bulkPaymentRows" rows="8" style="width:100%;padding:12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;resize:vertical" placeholder="MZ-07-001-005-001/389,1240&#10;MZ-07-001-005-002/390,850"></textarea><p class="muted">A header row such as Job Card, Amount is allowed. Duplicate job cards are rejected to prevent accidental double entry.</p></div><button class="btn" id="previewBulkPayments" type="button">Preview batch</button> <button class="btn ghost" id="cancelBulkPayments" type="button">Cancel</button><div id="bulkPaymentPreview"></div>';
 $('overlay').classList.remove('hidden');
 $('cancelBulkPayments').addEventListener('click',()=>$('overlay').classList.add('hidden'));
 $('previewBulkPayments').addEventListener('click',()=>{
  const parsed=parseBulkPayments($('bulkPaymentRows').value),date=$('bulkPaymentDate').value,box=$('bulkPaymentPreview');
  if(!date){box.innerHTML='<div class="notice err">Choose a payment date.</div>';return;}
  if(parsed.errors.length){box.innerHTML='<div class="notice err">'+parsed.errors.map(esc).join('<br>')+'</div>';return;}
  const total=parsed.rows.reduce((sum,row)=>sum+row.amount,0);
  box.innerHTML='<div class="notice info">Review before saving: <b>'+parsed.rows.length+' payments</b>, total <b>'+fmt(total)+'</b>, method <b>Bank</b>, date <b>'+esc(date)+'</b>. The server will verify every job card before inserting the batch.</div><div style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th>Job card</th><th style="text-align:right">Amount</th></tr></thead><tbody>'+parsed.rows.map(row=>'<tr><td>'+esc(row.job_card_number)+'</td><td style="text-align:right">'+fmt(row.amount)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">Saving creates separate Bank payment entries; it does not change charges or delete existing transactions.</p><button class="btn" id="saveBulkPayments" type="button">Save '+parsed.rows.length+' bank payments</button> <button class="btn ghost" id="editBulkPayments" type="button">Edit batch</button><div id="bulkSaveError"></div>';
  $('editBulkPayments').addEventListener('click',()=>{$('bulkPaymentPreview').innerHTML='';});
  $('saveBulkPayments').addEventListener('click',async()=>{
   if(busy)return;
   if(!window.confirm('Save '+parsed.rows.length+' Bank payment entries totalling '+fmt(total)+'?'))return;
   busy=true;$('saveBulkPayments').disabled=true;$('saveBulkPayments').textContent='Saving batch…';
   try{
    const {data,error}=await supabaseClient.functions.invoke('vbgramg-contribution-data',{body:{action:"bulk-bank-payment",entry_date:date,entries:parsed.rows}});
    if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save bank payment batch.');
    entries.push(...(data.entries||[]));deriveCitizens();render();$('overlay').classList.add('hidden');
    status('Saved '+data.count+' Bank payments totalling '+fmt(data.total_amount)+'. Ledger updated.');
   }catch(err){$('bulkSaveError').innerHTML='<div class="notice err">'+esc(err.message||'Could not save bank payment batch.')+'</div>';if($('saveBulkPayments')){$('saveBulkPayments').disabled=false;$('saveBulkPayments').textContent='Save '+parsed.rows.length+' bank payments';}}
   finally{busy=false;}
  });
 });
}

function updateEntryInMemory(entry){
 const index=entries.findIndex(e=>String(e.id)===String(entry.id));

}
function showEditForm(id){
 const c=currentCitizen;if(!c)return;

 const isCharge=e.entry_type==="charge"&&String(e.note||"").trim().toLowerCase()!=="return";

 $('sheetBody').innerHTML='<div class="notice info">Editing '+esc(typeLabel)+'. Original and revised values will be recorded in the audit log.</div><form id="editEntryForm"><div class="field"><label for="editAmount">Amount (₹)</label><input id="editAmount" type="number" min="0.01" max="10000000" step="0.01" required value="'+esc(e.amount)+'"></div><div class="grid2"><div class="field"><label for="editDate">Transaction date</label><input id="editDate" type="date" required value="'+esc(String(e.entry_date||new Date().toISOString().slice(0,10)).slice(0,10))+'"></div><div class="field"><label for="editNote">Note</label><input id="editNote" maxlength="200" value="'+esc(e.note||"")+'" placeholder="Optional note"></div></div>'+(isCharge?'<div class="field"><label for="editPeriod">Charge month</label><input id="editPeriod" type="month" required value="'+esc(String(e.charge_period||"").slice(0,7))+'"></div><div class="field"><label><input id="editDeferred" type="checkbox" '+(e.is_deferred?'checked':'')+' style="width:auto;min-height:0;margin-right:8px"> Deferred charge</label></div>':'')+'<button class="btn" id="saveEdit" type="submit">Save changes</button> <button class="btn ghost" id="cancelEdit" type="button">Cancel</button><div id="editError"></div></form>';
 $('cancelEdit').addEventListener('click',()=>openCitizen(c.id));
 $('editEntryForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const payload={action:"edit-ledger-entry",id:e.id,amount:Number($('editAmount').value),entry_date:$('editDate').value,note:$('editNote').value};

  }catch(err){$('editError').innerHTML='<div class="notice err">'+esc(err.message||'Could not edit transaction.')+'</div>';}
  finally{busy=false;if($('saveEdit')){$('saveEdit').disabled=false;$('saveEdit').textContent='Save changes';}}
 });
}

async function payInFull(){
 const c=currentCitizen;if(!c||busy||c.balance<=0)return;

 try{
  const {data,error}=await supabaseClient.functions.invoke('vbgramg-contribution-data',{body:{action:"pay-in-full",job_card_number:c.id,entry_date:new Date().toISOString().slice(0,10)}});

}

async function load(){
 if(busy)return;
 $('refreshBtn').disabled=true;
 try{
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError||!sessionData.session){status('Sign in from the VBGRAMG home page first.');$('app').classList.add('hidden');return;}
  const {data:access,error:accessError}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
  if(accessError||!access||access.approved!==true){status((access&&access.error)||(accessError&&accessError.message)||'This account is not approved.','err');$('app').classList.add('hidden');return;}
  status('Loading active MIS and contribution ledger…');
  const {data,error}=await supabaseClient.functions.invoke('vbgramg-contribution-data',{body:{action:'list'}});
  if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not load contribution data.');
  appRole=String(data.role||"");$("bulkPaymentBtn").classList.toggle("hidden",appRole!=="admin");entries=data.entries||[];citizenRegistry=data.citizens||[];deriveCitizens();
  $('app').classList.remove('hidden');status('Loaded active MIS job cards and '+entries.length.toLocaleString('en-IN')+' contribution ledger entries. Job card details come from active MIS; balances and history come from the ledger.');
  render();
 }catch(err){status(err.message||'Could not load contribution data.','err');}
 finally{$('refreshBtn').disabled=false;}
}
