name: Test shared ledger calculations

on:
  pull_request:
    paths:
      - "supabase/functions/shared/ledger-calculations.js"
      - "tests/ledger-calculations.test.cjs"
      - "tests/postgres-contribution-balances.test.cjs"
      - "tests/atomic-contribution-writes.test.cjs"
      - "tests/fto-transaction-link-safeguards.test.cjs"
      - "tests/atomic-contribution-writes-postgres.sql"
      - "tests/extra-contribution-charges.test.cjs"
      - "tests/extra-contribution-charges-postgres.sql"
      - "supabase/migrations/20261107140000_atomic_extra_contribution_charges.sql"
      - "supabase/migrations/20261109130000_reconcile_extra_contribution_charge_edits.sql"
      - "tests/extra-contribution-reconciliation.test.cjs"
      - "tests/extra-contribution-reconciliation-postgres.sql"
      - "supabase/migrations/20261107170000_atomic_contribution_ledger_edits.sql"
      - "tests/contribution-ledger-edits-postgres.sql"
      - "tests/atomic-contribution-writes-concurrency.sh"
      - "supabase/migrations/20261106181317_record_contribution_transaction.sql"
      - "supabase/migrations/20261107120000_atomic_bulk_bank_payment.sql"
      - "supabase/migrations/20261107050000_postgres_fto_charge_calculation.sql"
      - ".github/workflows/test-ledger-calculations.yml"
      - "docs/architecture/atomic-contribution-writes.md"
      - "supabase/functions/vbgramg-contribution-data/index.ts"
      - "contribution.html"
      - "demand.html"
      - "supabase/functions/vbgramg-demand-runs/index.ts"
      - "tests/work-demand-requires-existing-period.test.cjs"
      - "tests/fto-exemption-period-eligibility.test.cjs"
      - "tests/fto-revision-history-postgres.sql"
      - "supabase/migrations/20261111105048_add_fto_revision_history.sql"
      - "supabase/migrations/20261111110537_create_fto_revision_preview.sql"
      - "tests/fto-revision-fifo-simulation-postgres.sql"
      - "supabase/migrations/20261113180000_add_fto_revision_fifo_rebuild.sql"
      - "tests/fto-revision-fifo-rebuild-postgres.sql"
      - "tests/fto-revision-snapshot-postgres.sql"
      - "supabase/migrations/20261111120000_track_contribution_exemption_intervals.sql"
      - "tests/fto-exemption-period-eligibility-postgres.sql"
      - "supabase/migrations/20261111160000_serialize_fto_snapshot_with_exemptions.sql"
      - "tests/fto-exemption-snapshot-lock.test.cjs"
      - "supabase/migrations/20261106190000_include_active_mis_cards_in_financial_summary.sql"
      - "tests/postgres-contribution-balances.test.cjs"
      - "supabase/functions/vbgramg-contribution-data/index.ts"
      - "contribution.html"
      - "demand.html"
      - "supabase/migrations/20261106190000_include_active_mis_cards_in_financial_summary.sql"
      - "tests/data-loader.test.cjs"
      - "tests/auto-allocate-unallocated-payments.test.cjs"
      - "tests/auto-allocate-unallocated-payments-postgres.sql"
      - "supabase/migrations/20261107200000_auto_allocate_unallocated_payments_on_new_charge.sql"
      - "supabase/migrations/20261108150000_auto_allocate_on_new_payment.sql"
      - "supabase/migrations/20261108190000_period_linked_new_waivers.sql"
      - "tests/new-waiver-period-allocation-postgres.sql"
      - "tests/new-waiver-period-allocation.test.cjs"
      - "tests/voided-payment-allocation-safeguards.test.cjs"
      - "supabase/migrations/20261109100000_ignore_voided_payment_allocations.sql"
      - "js/data-loader.js"
      - ".github/workflows/test-ledger-calculations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/shared/ledger-calculations.js"
      - "tests/ledger-calculations.test.cjs"
      - ".github/workflows/test-ledger-calculations.yml"

permissions:
  contents: read

jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run shared ledger tests
        run: node --test tests/ledger-calculations.test.cjs tests/data-loader.test.cjs tests/postgres-contribution-balances.test.cjs tests/atomic-contribution-writes.test.cjs tests/fto-transaction-link-safeguards.test.cjs tests/extra-contribution-charges.test.cjs tests/extra-contribution-reconciliation.test.cjs
      - name: Run charge-level allocation schema static tests
        run: node --test tests/charge-level-payment-allocations.test.cjs
      - name: Run automatic unallocated payment FIFO static tests
        run: node --test tests/auto-allocate-unallocated-payments.test.cjs
      - name: Run new waiver allocation static tests
        run: node --test tests/new-waiver-period-allocation.test.cjs
      - name: Run voided payment allocation safeguard tests
        run: node --test tests/voided-payment-allocation-safeguards.test.cjs
      - name: Run Work Demand period requirement tests
        run: node --test tests/work-demand-requires-existing-period.test.cjs
      - name: Run FTO exemption interval eligibility tests
        run: node --test tests/fto-exemption-period-eligibility.test.cjs
      - name: Run FTO snapshot exemption lock tests
        run: node --test tests/fto-exemption-snapshot-lock.test.cjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify shared module in Deno
        run: |
          deno eval '
            import "./supabase/functions/shared/ledger-calculations.js";
            const api = globalThis.VBGRAMGLedgerCalculations;
            if (typeof api?.jobCardSuffixNumber !== "function") {
              throw new Error("Shared job-card sorting helper did not load in Deno.");
            }
            if (api.calculateLedgerState !== undefined) {
              throw new Error("JavaScript financial calculation API must not be exposed.");
            }
            if (api.jobCardSuffixNumber("JC/145-D") !== 145) {
              throw new Error("Unexpected Deno job-card suffix result.");
            }
            console.log("Deno shared-module check passed.");
          '

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vbgramg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vbgramg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vbgramg_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run atomic contribution PostgreSQL integration tests
        run: psql -v ON_ERROR_STOP=1 -f tests/atomic-contribution-writes-postgres.sql
      - name: Run FTO revision history PostgreSQL tests
        run: |
          createdb vbgramg_fto_revision_test
          PGDATABASE=vbgramg_fto_revision_test psql -v ON_ERROR_STOP=1 -f tests/fto-revision-history-postgres.sql
      - name: Run FTO FIFO simulation PostgreSQL tests
        run: |
          createdb vbgramg_fto_fifo_simulation_test
          PGDATABASE=vbgramg_fto_fifo_simulation_test psql -v ON_ERROR_STOP=1 -f tests/fto-revision-fifo-simulation-postgres.sql
      - name: Run FTO full FIFO rebuild PostgreSQL tests
        run: |
          createdb vbgramg_fto_fifo_rebuild_test
          PGDATABASE=vbgramg_fto_fifo_rebuild_test psql -v ON_ERROR_STOP=1 -f tests/fto-revision-fifo-rebuild-postgres.sql
      - name: Run FTO revision snapshot PostgreSQL tests
        run: |
          createdb vbgramg_fto_revision_snapshot_test
          PGDATABASE=vbgramg_fto_revision_snapshot_test psql -v ON_ERROR_STOP=1 -f tests/fto-revision-snapshot-postgres.sql
      - name: Run FTO exemption interval PostgreSQL tests
        run: |
          createdb vbgramg_fto_exemption_test
          PGDATABASE=vbgramg_fto_exemption_test psql -v ON_ERROR_STOP=1 -f tests/fto-exemption-period-eligibility-postgres.sql
      - name: Run FTO snapshot exemption PostgreSQL integration tests
        run: |
          createdb vbgramg_fto_snapshot_test
          PGDATABASE=vbgramg_fto_snapshot_test psql -v ON_ERROR_STOP=1 -f tests/fto-exemption-snapshot-lock-postgres.sql
      - name: Run atomic extra contribution charge PostgreSQL tests
        run: |
          createdb vbgramg_extras_test
          PGDATABASE=vbgramg_extras_test psql -v ON_ERROR_STOP=1 -f tests/extra-contribution-charges-postgres.sql
      - name: Run extra contribution allocation reconciliation PostgreSQL tests
        run: |
          createdb vbgramg_extra_reconcile_test
          PGDATABASE=vbgramg_extra_reconcile_test psql -v ON_ERROR_STOP=1 -f tests/extra-contribution-reconciliation-postgres.sql
      - name: Run atomic contribution ledger edit PostgreSQL tests
        run: |
          createdb vbgramg_edits_test
          PGDATABASE=vbgramg_edits_test psql -v ON_ERROR_STOP=1 -f tests/contribution-ledger-edits-postgres.sql
      - name: Run automatic unallocated payment FIFO PostgreSQL tests
        run: |
          createdb vbgramg_auto_allocate_test
          PGDATABASE=vbgramg_auto_allocate_test psql -v ON_ERROR_STOP=1 -f tests/auto-allocate-unallocated-payments-postgres.sql
      - name: Run new period-linked waiver PostgreSQL tests
        run: |
          createdb vbgramg_new_waiver_test
          PGDATABASE=vbgramg_new_waiver_test psql -v ON_ERROR_STOP=1 -f tests/new-waiver-period-allocation-postgres.sql
      - name: Run voided payment safeguard PostgreSQL tests
        run: |
          createdb vbgramg_voided_payment_test
          PGDATABASE=vbgramg_voided_payment_test psql -v ON_ERROR_STOP=1 -f tests/voided-payment-allocation-safeguards-postgres.sql
      - name: Verify per-job-card advisory lock serializes concurrent writes
        run: bash tests/atomic-contribution-writes-concurrency.sh
