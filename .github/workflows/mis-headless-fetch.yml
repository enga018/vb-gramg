name: Selenium MIS portal diagnostics (read-only)

on:
  workflow_dispatch:
    inputs:
      payload_url:
        description: "Village Council Payload URL from the official VBGRAMG portal"
        required: true
        type: string
  push:
    paths:
      - "scripts/fetch_mis_preview.py"
      - ".github/workflows/mis-headless-fetch.yml"

permissions:
  contents: read

concurrency:
  group: mis-headless-fetch
  cancel-in-progress: false

jobs:
  fetch-mis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.26"

      - name: Navigate the official portal and inspect report
        env:
          MIS_PAYLOAD_URL: ${{ github.event.inputs.payload_url }}
        run: |
          echo "::add-mask::${MIS_PAYLOAD_URL}"
          python scripts/fetch_mis_preview.py

      - name: Upload HTML and JSON diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-selenium-diagnostics
          path: output/*
          if-no-files-found: warn
          retention-days: 7
