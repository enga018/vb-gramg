<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>VBGRAMG — Sign in</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#0f172a}
main{width:min(100%,560px);padding:clamp(22px,5vw,36px);background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 12px 32px rgb(15 23 42 / 8%)}
h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2rem)}p{margin:0 0 20px;color:#475569;line-height:1.5}
label{display:block;margin:14px 0 6px;font-weight:650}input{display:block;width:100%;min-height:46px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
button,.tool-link{display:block;width:100%;min-height:48px;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#0f172a;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
button.secondary{background:#e2e8f0;color:#0f172a}button:disabled{opacity:.5;cursor:wait}
.status{margin-top:16px;padding:12px;background:#f8fafc;border-radius:9px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fef2f2;color:#991b1b}.status.success{background:#f0fdf4;color:#166534}
.hidden{display:none!important}.muted{font-size:.875rem;color:#64748b}
</style></head><body><main>
<h1>VBGRAMG</h1><p>Sign in with an approved account to access the application.</p>
<section id="login-panel"><form id="login-form">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required maxlength="254">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="login-button" type="submit">Sign in</button></form>
<p class="muted">Accounts are created and approved by the administrator. Public registration is disabled.</p></section>
<section id="app-panel" class="hidden"><p id="account-label"></p><a class="tool-link" href="mis.html">Open MIS Importer</a><button type="button" id="logout-button" class="secondary">Sign out</button></section>
<div id="status" class="status" aria-live="polite">Checking your session…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const loginPanel=document.getElementById('login-panel'),appPanel=document.getElementById('app-panel'),loginButton=document.getElementById('login-button'),statusBox=document.getElementById('status');
let verificationSequence=0;
function setStatus(message,type){statusBox.textContent=message;statusBox.classList.toggle('error',type==='error');statusBox.classList.toggle('success',type==='success')}
function showLoggedOut(){loginPanel.classList.remove('hidden');appPanel.classList.add('hidden')}
async function verifyAccess(user){
 const sequence=++verificationSequence;
 if(!user){showLoggedOut();setStatus('Sign in to continue.');return false}
 const {data,error}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
 if(sequence!==verificationSequence)return false;
 if(error||!data||data.approved!==true){await supabaseClient.auth.signOut();showLoggedOut();setStatus((data&&data.error)||(error&&error.message)||'This account is not approved for the app.','error');return false}
 loginPanel.classList.add('hidden');appPanel.classList.remove('hidden');
 document.getElementById('account-label').textContent='Signed in as '+data.email+(data.role==='admin'?' · Administrator':'');
 setStatus('Access verified.','success');return true
}
document.getElementById('login-form').addEventListener('submit',async event=>{
 event.preventDefault();loginButton.disabled=true;
 try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;
 if(!(await verifyAccess(data.user)))return
 }catch(error){showLoggedOut();setStatus('Sign-in failed: '+(error&&error.message?error.message:String(error)),'error')}
 finally{loginButton.disabled=false}
});
document.getElementById('logout-button').addEventListener('click',async()=>{const {error}=await supabaseClient.auth.signOut();showLoggedOut();setStatus(error?'Sign-out error: '+error.message:'You are signed out.',error?'error':'')});
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){showLoggedOut();setStatus('You are signed out.')}else if(event==='TOKEN_REFRESHED'&&session){Promise.resolve().then(()=>verifyAccess(session.user))}});
supabaseClient.auth.getSession().then(({data,error})=>{if(error){showLoggedOut();setStatus(error.message,'error');return}return verifyAccess(data.session?data.session.user:null)});
</script></body></html>
