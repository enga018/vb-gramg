<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>MIS — Import Excel Data</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: #f1f5f9; color: #0f172a; }
    main { width: min(100%, 1100px); margin: 0 auto; padding: clamp(20px, 4vw, 32px); background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
    p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
    .file-box { padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; margin: 18px 0 14px; }
    .file-label { display: block; margin-bottom: 10px; font-weight: 650; }
    input[type=file] { display: block; width: 100%; max-width: 100%; font: inherit; font-size: .9rem; }
    button { width: 100%; min-height: 50px; padding: 13px 18px; border: 0; border-radius: 12px; background: #0f172a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .status { margin-top: 16px; padding: 12px 14px; background: #f8fafc; border-radius: 10px; font-size: .9rem; white-space: pre-wrap; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .table-wrap { overflow: auto; max-height: 560px; margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; white-space: pre; }
    th, td { padding: 9px 11px; border: 1px solid #cbd5e1; text-align: left; }
    th { position: sticky; top: 0; background: #dbeafe; z-index: 1; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>MIS — Import Excel</h1>
    <p>Import the worksheet exactly as provided. The importer does not remove rows, fill blanks, change columns, filter statuses, or generate values. The file is processed in your browser and is not uploaded to a server.</p>
    <div class="file-box">
      <label class="file-label" for="source-file">Choose Excel or CSV file</label>
      <input type="file" id="source-file" accept=".xlsx,.xls,.xlsm,.csv">
    </div>
    <button type="button" id="import-button">Import data as it is</button>
    <div id="status" class="status" aria-live="polite">Choose a file to begin.</div>
    <div id="preview-wrap" class="table-wrap hidden">
      <table id="preview"><thead></thead><tbody></tbody></table>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const sourceInput = document.getElementById('source-file');
    const importButton = document.getElementById('import-button');
    const statusBox = document.getElementById('status');
    const previewWrap = document.getElementById('preview-wrap');
    const preview = document.getElementById('preview');
    let importedRows = [];
    let importedWorkbook = null;
    let importedSheetName = 'Sheet1';

    function setStatus(message, error) {
      statusBox.textContent = message;
      statusBox.classList.toggle('error', !!error);
    }
    function renderRows(rows) {
      const thead = preview.querySelector('thead');
      const tbody = preview.querySelector('tbody');
      thead.replaceChildren();
      tbody.replaceChildren();
      const maxCols = rows.reduce((max, row) => Math.max(max, row.length), 0);
      const header = document.createElement('tr');
      for (let i = 0; i < maxCols; i++) {
        const th = document.createElement('th');
        th.textContent = 'Column ' + (i + 1);
        header.appendChild(th);
      }
      thead.appendChild(header);
      rows.slice(0, 500).forEach(function (row) {
        const tr = document.createElement('tr');
        for (let i = 0; i < maxCols; i++) {
          const td = document.createElement('td');
          const value = row[i] == null ? '' : String(row[i]);
          td.textContent = value;
          td.title = value;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      previewWrap.classList.remove('hidden');
    }

    importButton.addEventListener('click', async function () {
      const file = sourceInput.files[0];
      if (!file) { setStatus('Please choose an Excel or CSV file first.', true); return; }
      if (typeof XLSX === 'undefined') { setStatus('Excel reader failed to load. Check your internet connection, refresh the page, and try again.', true); return; }
      importButton.disabled = true;
      previewWrap.classList.add('hidden');
      try {
        setStatus('Importing worksheet without changing its rows or columns…', false);
        const buffer = await file.arrayBuffer();
        importedWorkbook = XLSX.read(buffer, { type: 'array', raw: false, cellDates: false });
        importedSheetName = importedWorkbook.SheetNames[0];
        const sheet = importedWorkbook.Sheets[importedSheetName];
        if (!sheet) throw new Error('The selected workbook has no worksheet.');
        importedRows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '', blankrows: true });
        renderRows(importedRows);
        const note = importedRows.length > 500 ? '\\nPreview shows the first 500 rows; all imported rows remain in the workbook.' : '';
        setStatus('Import complete. Worksheet: ' + importedSheetName + '\\nRows read: ' + importedRows.length + '\\nColumns detected: ' + importedRows.reduce((max, row) => Math.max(max, row.length), 0) + '\\nNo data-cleaning or transformation rules were applied.' + note, false);
      } catch (error) {
        setStatus('Could not import this file: ' + (error && error.message ? error.message : String(error)), true);
      } finally {
        importButton.disabled = false;
      }
    });
  </script>
</body>
</html>
