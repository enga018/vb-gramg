<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#f3f6fb">
<title>VBGRAMG — Contribution</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb;--ink:#172033;--muted:#667085;--line:#e3e8f0;--surface:#fff;--surface-soft:#f7f9fc;--accent:#2457c5;--radius:16px;--paid:#15803d;--partial:#b45309;--due:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;padding:20px;background:#f3f6fb;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
main{width:min(100%,1440px);margin:0 auto;padding:0 0 44px}
.topbar,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px rgb(23 32 51 / 4%)}
.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:18px 22px;margin:0 auto 18px;flex-wrap:wrap}
.brand h1{font-size:1.45rem;letter-spacing:-.035em;margin:0;color:var(--ink)}.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}.brand a{color:inherit;text-decoration:none}.brand a:hover{text-decoration:underline}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:.9rem;font-weight:650;border:1px solid transparent;border-radius:10px;min-height:42px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.btn:hover{background:#2c3b55}.btn.ghost{background:#f0f3f8;color:#344054;border-color:#e0e6ef}.btn.ghost:hover{background:#e6ebf3}.btn.small{min-height:40px;padding:9px 13px;font-size:.88rem}.btn:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}.btn:disabled{opacity:.48;cursor:not-allowed}
.panel{padding:clamp(18px,2.5vw,28px);margin-bottom:16px}.panel h1{font-size:1.18rem;margin:0 0 6px;letter-spacing:-.02em}.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-width:0}.stat .k{display:block;color:var(--muted);font-size:.78rem;font-weight:600;margin-bottom:7px;line-height:1.3}.stat .v{display:block;font-size:1.08rem;font-weight:750;letter-spacing:-.02em;line-height:1.35;overflow-wrap:anywhere;color:var(--ink)}.stat .v.due{color:var(--due)}.stat .v.paid{color:var(--paid)}
.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;min-height:44px;padding:10px 12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;outline:0;background:#fff;color:var(--ink)}.toolbar input:focus,.field input:focus,.field select:focus{outline:3px solid rgb(36 87 197 / 15%);border-color:#6f91dc}
.citizen{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--surface);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}.citizen:hover{background:#f6f9ff;border-color:#cbd8f0}.citizen:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}.citizen .info{flex:1;min-width:0}.citizen .info b{font-size:.93rem;display:block;font-weight:700;color:var(--ink)}.citizen .info small{font-size:.8rem;color:var(--muted);display:block;margin-top:3px;overflow-wrap:anywhere}.citizen .bal{font-size:.95rem;font-weight:750;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;flex:none}.dot.paid{background:var(--paid)}.dot.partial{background:var(--partial)}.dot.due{background:var(--due)}
.badge{display:inline-flex;font-size:.66rem;font-weight:750;padding:4px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}.badge.paid{background:#e6f4ea;color:var(--paid)}.badge.partial{background:#fdf1e3;color:var(--partial)}.badge.due{background:#fdeaea;color:var(--due)}
.notice{padding:11px 13px;border:1px solid #e5eaf2;border-radius:10px;background:#f7f9fc;color:#475467;font-size:.88rem;line-height:1.45;margin:0 0 16px;overflow-wrap:anywhere}.notice.err{background:#fff4f2;border-color:#ffd8d2;color:#a12b20}.notice.info{background:#f7f9fc;border-color:#e5eaf2;color:#475467}.hidden{display:none!important}.empty{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}.count{color:var(--muted);font-size:.84rem;margin:0 0 10px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 16px 50px rgb(15 23 42 / 18%)}.sheet-head{position:sticky;top:0;background:var(--surface);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}.sheet-head h2{margin:0;font-size:1.05rem}.x{background:#f0f3f8;border:1px solid #e0e6ef;width:36px;height:36px;border-radius:10px;font-size:19px;color:#475467;cursor:pointer}.sheet-body{padding:18px}.balance{padding:20px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);margin-bottom:14px}.balance .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.balance .amount{font-size:clamp(30px,5vw,38px);font-weight:800;letter-spacing:-1px;margin:3px 0}.balance .amount.owing{color:var(--due)}.balance .amount.zero{color:var(--paid)}
.split{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}.split>div{flex:1;padding:12px;text-align:center;min-width:0}.split>div+div{border-left:1px solid var(--line)}.split .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.split .v{font-size:.95rem;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;margin:18px 0 8px}.entry{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f5}.entry:last-child{border-bottom:0}.entry .desc{flex:1;min-width:0}.entry .desc b{display:block;font-size:.88rem;overflow-wrap:anywhere}.entry .desc small{color:var(--muted);font-size:.76rem}.entry .amt{font-size:.9rem;font-weight:750;white-space:nowrap}.entry .amt.payment{color:var(--paid)}
.field{margin-bottom:12px}.field label{display:block;font-size:.82rem;font-weight:650;color:#344054;margin-bottom:6px}.field input,.field select{width:100%;min-height:44px;padding:10px 12px;font:inherit;border:1px solid #cfd7e4;border-radius:10px;background:#fff;outline:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px}
@media(min-width:900px){.overlay{align-items:center;padding:20px}.sheet{border-radius:16px;max-height:88vh}}
@media(max-width:700px){body{padding:10px}.topbar{padding:15px;gap:14px;border-radius:13px;margin-bottom:12px}.brand h1{font-size:1.3rem}.top-actions{width:100%;justify-content:flex-start;gap:8px}.panel{padding:14px;border-radius:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat{padding:11px 12px;border-radius:10px}.stat .k{font-size:.74rem;margin-bottom:5px}.stat .v{font-size:1rem}.stat:last-child{grid-column:span 2}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.toolbar input{min-width:0;width:100%;grid-column:1/-1}.citizen{padding:12px 10px;gap:8px}.citizen .bal{font-size:.88rem}.grid2{grid-template-columns:1fr}.split>div{padding:10px 6px}.split .k{font-size:.61rem}.split .v{font-size:.84rem}.sheet-body{padding:14px}}
@media(max-width:360px){body{padding:7px}.panel{padding:11px}.topbar{padding:12px}.citizen{padding:10px 8px}.citizen .info b{font-size:.86rem}.citizen .info small{font-size:.73rem}.badge{font-size:.6rem;padding:3px 6px}.split .v{font-size:.78rem}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><h1>Contribution</h1><p><a href="./">← Main menu</a></p></div><div class="top-actions"><button class="btn ghost small" id="refreshBtn" type="button">Refresh</button></div></header>
<main>
<section class="panel"><div id="status" class="notice info">Checking your approved account…</div><div id="importNote" class="sub hidden"></div></section>
<div id="app" class="hidden">
<section class="panel">
<div class="stats"><div class="stat"><div class="k">Households</div><div class="v" id="households">—</div></div><div class="stat"><div class="k">Total charged</div><div class="v" id="charged">—</div></div><div class="stat"><div class="k">Outstanding</div><div class="v due" id="outstanding">—</div></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search name or full job card number" autocomplete="off"><button id="clearSearch" class="btn ghost" type="button">Clear</button></div><p id="count" class="count"></p><div id="citizens"></div><div id="empty" class="empty hidden">No matching job cards found.</div>
</section>
</div>
</main>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Contribution statement</h2><button class="x" id="closeSheet" aria-label="Close">×</button></div><div id="sheetBody" class="sheet-body"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let entries=[], imports=[], citizens=[], citizenRegistry=[], currentCitizen=null, busy=false;
const fmt=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Date not recorded';
const formatPeriod=s=>{const m=String(s||'').match(/^(\\d{4})-(\\d{2})/);if(!m)return s||'Monthly charge';const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const n=Number(m[2]);return n>=1&&n<=12?months[n-1]+' '+m[1]:(s||'Monthly charge')};
function status(message,type='info'){ $('status').className='notice '+(type==='err'?'err':'info');$('status').textContent=message; }
function deriveCitizens(){
 const map=new Map();
 for(const r of citizenRegistry){const key=String(r.job_card_number||'').trim();if(!key)continue;map.set(key,{id:key,jobCard:key,name:r.person_name||'Unnamed',charges:0,activeCharges:0,deferred:0,paid:0,waived:0,returns:0,ledger:[]});}
 for(const e of entries){
  const key=String(e.job_card_number||'').trim(); if(!key)continue;
  if(!map.has(key))map.set(key,{id:key,jobCard:key,name:e.person_name||'Unnamed',charges:0,activeCharges:0,deferred:0,paid:0,waived:0,returns:0,ledger:[]});
  const c=map.get(key); c.ledger.push(e);
  const amount=Number(e.amount)||0;
  if(e.entry_type==='charge'||e.entry_type==='sanitationFee'){
   c.charges+=amount;
   if(e.is_deferred)c.deferred+=amount;else c.activeCharges+=amount;
  }else if(e.entry_type==='payment')c.paid+=amount;
  else if(e.entry_type==='forgive')c.waived+=amount;
  else if(e.entry_type==='return')c.returns+=amount;
 }
 citizens=[...map.values()].map(c=>({...c,totalCharged:c.charges-Math.min(c.charges,c.waived),balance:c.activeCharges-Math.min(c.activeCharges,c.waived)-c.paid+c.returns})).sort((a,b)=>a.name.localeCompare(b.name)||a.id.localeCompare(b.id));
}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase();
 const list=citizens.filter(c=>c.name.toLocaleLowerCase().includes(q)||c.id.toLocaleLowerCase().includes(q));
 $('households').textContent=citizens.length.toLocaleString('en-IN');
 $('charged').textContent=fmt(citizens.reduce((s,c)=>s+c.totalCharged,0));
 $('outstanding').textContent=fmt(citizens.reduce((s,c)=>s+Math.max(0,c.balance),0));
 $('count').textContent='Showing '+list.length.toLocaleString('en-IN')+' of '+citizens.length.toLocaleString('en-IN')+' job cards';
 $('citizens').innerHTML=list.map(c=>{
  const state=c.balance<=0?'paid':c.paid>0?'partial':'due';
  return '<button class="citizen" type="button" data-card="'+esc(c.id)+'"><span class="dot '+state+'"></span><span class="info"><b>'+esc(c.name)+'</b><small>Job card: '+esc(c.id)+' · '+c.ledger.length+' ledger entries</small></span><span style="text-align:right"><span class="bal">'+fmt(Math.max(0,c.balance))+'</span><br><span class="badge '+state+'">'+(state==='paid'?'Settled':state==='partial'?'Partial':'Due')+'</span></span></button>';
 }).join('');
 $('empty').classList.toggle('hidden',list.length!==0);
}
function openCitizen(id){
 currentCitizen=citizens.find(c=>c.id===id);if(!currentCitizen)return;
 const c=currentCitizen;
 $('sheetTitle').textContent=c.name;
 const sorted=[...c.ledger].sort((a,b)=>(a.entry_date||'').localeCompare(b.entry_date||'')||(a.created_at||'').localeCompare(b.created_at||''));
 const lines=sorted.map(e=>{
  const type=e.entry_type, amount=Number(e.amount)||0, isPayment=type==='payment';
  const label=type==='charge'?'Charge · '+(e.charge_period?formatPeriod(e.charge_period):'Monthly charge')+(e.is_deferred?' · Deferred':''):type==='sanitationFee'?'Sanitation fee':type==='payment'?'Payment':type==='forgive'?'Waiver':type==='return'?'Return':type;
  return '<div class="entry"><div class="desc"><b>'+esc(label)+(e.note?' · '+esc(e.note):'')+'</b><small>'+esc(day(e.entry_date))+'</small></div><div class="amt '+(isPayment?'payment':'')+'">'+(isPayment?'−':'')+fmt(amount)+'</div></div>';
 }).join('');
 $('sheetBody').innerHTML='<div class="balance"><div class="label">Current outstanding balance</div><div class="amount '+(c.balance<=0?'zero':'owing')+'">'+fmt(Math.max(0,c.balance))+'</div><div class="sub" style="margin:0">Full job card: '+esc(c.id)+'</div></div><div class="split"><div><div class="k">Charges incl. fees</div><div class="v">'+fmt(c.charges)+'</div></div><div><div class="k">Payments</div><div class="v" style="color:var(--paid)">'+fmt(c.paid)+'</div></div><div><div class="k">Waivers / returns</div><div class="v">'+fmt(c.waived+c.returns)+'</div></div><div><div class="k">Deferred</div><div class="v">'+fmt(c.deferred)+'</div></div></div><button class="btn" type="button" id="addPaymentBtn">Record payment</button><div class="section-title">Ledger history</div>'+(lines||'<div class="empty">No ledger entries.</div>');
 $('overlay').classList.remove('hidden');
 $('addPaymentBtn').addEventListener('click',showPaymentForm);
}
function showPaymentForm(){
 const c=currentCitizen;if(!c)return;
 $('sheetBody').innerHTML='<div class="notice info">Record a payment against this full job card. The amount is added to the ledger; it does not delete or alter earlier charges.</div><form id="paymentForm"><div class="field"><label for="paymentAmount">Payment amount (₹)</label><input id="paymentAmount" type="number" min="0.01" max="10000000" step="0.01" required inputmode="decimal"></div><div class="grid2"><div class="field"><label for="paymentDate">Payment date</label><input id="paymentDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label for="paymentMethod">Method / note</label><select id="paymentMethod"><option>Cash</option><option>Bank</option><option>UPI</option><option>Other</option></select></div></div><button class="btn" type="submit" id="savePayment">Save payment</button> <button class="btn ghost" type="button" id="cancelPayment">Cancel</button><div id="paymentError"></div></form>';
 $('cancelPayment').addEventListener('click',()=>openCitizen(c.id));
 $('paymentForm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(busy)return;
  const amount=Number($('paymentAmount').value),date=$('paymentDate').value,note=$('paymentMethod').value;
  if(!Number.isFinite(amount)||amount<=0){$('paymentError').innerHTML='<div class="notice err">Enter an amount greater than zero.</div>';return;}
  busy=true;$('savePayment').disabled=true;$('savePayment').textContent='Saving…';
  try{
   const {data,error}=await supabaseClient.functions.invoke('vbgramg-contribution-data',{body:{action:'add-payment',job_card_number:c.id,amount,entry_date:date,note}});
   if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not save payment.');
   entries.push(data.entry);deriveCitizens();render();openCitizen(c.id);status('Payment saved. Ledger updated.','info');
  }catch(err){$('paymentError').innerHTML='<div class="notice err">'+esc(err.message||'Could not save payment.')+'</div>';}
  finally{busy=false;if($('savePayment')){$('savePayment').disabled=false;$('savePayment').textContent='Save payment';}}
 });
}

async function load(){
 if(busy)return;
 $('refreshBtn').disabled=true;
 try{
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError||!sessionData.session){status('Sign in from the VBGRAMG home page first.');$('app').classList.add('hidden');return;}
  const {data:access,error:accessError}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
  if(accessError||!access||access.approved!==true){status((access&&access.error)||(accessError&&accessError.message)||'This account is not approved.','err');$('app').classList.add('hidden');return;}
  status('Loading contribution ledger…');
  const {data,error}=await supabaseClient.functions.invoke('vbgramg-contribution-data',{body:{action:'list'}});
  if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||'Could not load contribution data.');
  entries=data.entries||[];imports=data.imports||[];citizenRegistry=data.citizens||[];deriveCitizens();
  const jan=imports.find(i=>String(i.charge_period||'').startsWith('2026-01'));
  $('importNote').textContent=jan?'January 2026 import: '+Number(jan.row_count).toLocaleString('en-IN')+' charges · '+fmt(jan.total_amount):'No completed January import metadata found.';
  $('importNote').classList.remove('hidden');
  $('app').classList.remove('hidden');status('Signed in and approved. '+entries.length.toLocaleString('en-IN')+' ledger entries loaded.');
  render();
 }catch(err){status(err.message||'Could not load contribution data.','err');}
 finally{$('refreshBtn').disabled=false;}
}
$('citizens').addEventListener('click',e=>{const btn=e.target.closest('[data-card]');if(btn)openCitizen(btn.dataset.card);});
$('search').addEventListener('input',render);
$('clearSearch').addEventListener('click',()=>{$('search').value='';render();$('search').focus();});
$('refreshBtn').addEventListener('click',load);
$('closeSheet').addEventListener('click',()=>$('overlay').classList.add('hidden'));
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.add('hidden');});
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session){$('app').classList.add('hidden');status('Sign in from the VBGRAMG home page first.');}});
load();
})();
</script>
</body>
</html>
