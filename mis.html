<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>MIS — VBGRAMG</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px}main{width:min(100%,1440px);margin:0 auto}
.topbar,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 24px rgb(15 23 42 / 5%)}
.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 22px;margin-bottom:18px;flex-wrap:wrap}
.brand h1{font-size:1.5rem;margin:0 0 3px}.brand p{margin:0;color:#64748b;font-size:.92rem}
.account{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.account-label{font-size:.88rem;color:#475569;overflow-wrap:anywhere}
.panel{padding:clamp(18px,3vw,28px)}h2{margin:0 0 8px;font-size:1.2rem}p{color:#64748b;line-height:1.5}
label{display:block;font-weight:650;margin:14px 0 6px}input{font:inherit;min-height:44px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;width:100%}
button,.link-button{font:inherit;font-weight:650;border:0;border-radius:9px;min-height:42px;padding:10px 15px;background:#0f172a;color:white;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.secondary,.link-button.secondary{background:#e2e8f0;color:#0f172a}button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.login-card{max-width:460px;margin:7vh auto}.hidden{display:none!important}
.status{margin:14px 0 0;padding:12px 14px;border-radius:9px;background:#f8fafc;color:#475569;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}.status.error{background:#fef2f2;color:#991b1b}.status.success{background:#f0fdf4;color:#166534}
.toolbar{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:20px 0 14px}.search{flex:1;min-width:220px;max-width:560px}.search label,.filter-control label{margin-top:0}.filter-control{min-width:180px}.filter-control select{font:inherit;width:100%;min-height:44px;padding:10px 34px 10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#0f172a}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{padding:13px 16px;border:1px solid #e2e8f0;border-radius:13px;background:linear-gradient(145deg,#fff,#f8fafc);min-width:140px}.stat small{display:block;color:#64748b;margin-bottom:4px}.stat strong{font-size:1rem;overflow-wrap:anywhere}
.table-wrap{overflow:auto;max-height:68vh;border:1px solid #dbe3ee;border-radius:14px;background:#fff;box-shadow:0 3px 12px rgb(15 23 42 / 3%)}table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem;white-space:normal}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #e8edf4;vertical-align:middle;min-width:100px;max-width:420px;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:1;background:#f1f5f9;color:#475569;font-size:.76rem;letter-spacing:.045em;text-transform:uppercase;font-weight:750}td:first-child,th:first-child{min-width:58px;width:58px;color:#64748b}.jobcard-row{background:#fff;cursor:pointer;transition:background .15s}.jobcard-row:hover{background:#f1f7ff}.jobcard-row:active{background:#eaf2ff}.jobcard-row:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}.jobcard-row.has-selection{box-shadow:inset 3px 0 #16a34a}.jobcard-row.no-selection{box-shadow:inset 3px 0 #f59e0b}.applicant-detail td{background:#f8fafc}.applicant-detail table{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}.applicant-detail th{background:#e9eff7}.applicant-detail tbody tr:nth-child(even){background:#fff}.applicant-detail tbody tr:hover{background:#eff6ff}.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.muted{font-size:.86rem;color:#64748b}.section-head{display:flex;align-items:start;justify-content:space-between;gap:16px;flex-wrap:wrap}.section-head p{margin:4px 0 0}
@media(max-width:600px){body{padding:10px}.topbar{padding:15px}.account{width:100%}.account button{flex:1}.panel{padding:15px}.stat{flex:1;min-width:120px}}
</style>
</head>
<body>
<main>
<div id="app-panel" class="hidden">
<header class="topbar"><div class="brand"><h1>VBGRAMG</h1><p><a href="./" style="color:inherit">← Main menu</a> · Village Benefit Management · MIS records</p></div>
<div class="account"><span id="account-label" class="account-label"></span><a id="import-link" class="link-button hidden" href="./mis-import.html">Import MIS</a><button id="logout-button" class="secondary" type="button">Sign out</button></div></header>
<section class="panel">
<div class="section-head"><div><h2>MIS</h2><p>Current active MIS data from the database. Importing is an administrator tool; viewing the data is the main workspace.</p></div></div>
<div class="meta"><div class="stat"><small>Total Job Card</small><strong id="total-jobcards">—</strong></div><div class="stat"><small>Total Application</small><strong id="total-applicants">—</strong></div><div class="stat"><small>Demand</small><strong id="total-demand">—</strong></div><div class="stat"><small>Unwilling</small><strong id="total-unwilling">—</strong></div><div class="stat"><small>Last Updated</small><strong id="updated-at">—</strong></div></div>
<div class="toolbar"><div class="search"><label for="search-input">Search job cards or applicants</label><input id="search-input" type="search" placeholder="Job card number, household, applicant name or number…"></div><div class="filter-control"><label for="selection-filter">Selection status</label><select id="selection-filter"><option value="all">All job cards</option><option value="selected">Selected</option><option value="none">None selected</option></select></div><span id="result-count" class="muted"></span></div>
<div id="data-status" class="status" aria-live="polite">Loading MIS data…</div>
<div id="table-wrap" class="table-wrap hidden"><table id="mis-table"><thead></thead><tbody></tbody></table></div>
<div class="table-foot"><span id="page-label" class="muted"></span><div class="actions"><button id="prev-button" class="secondary" type="button">Previous</button><button id="next-button" class="secondary" type="button">Next</button></div></div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let currentRole=null,allRows=[],headers=[],jobCards=[],currentPage=0,pageSize=50,loadSequence=0,expandedCards=new Set(),selectedApplicants=new Map();
function status(el,msg,type){el.textContent=msg;el.classList.toggle('error',type==='error');el.classList.toggle('success',type==='success')}
async function verifyAccess(user){
 const seq=++loadSequence;
 if(!user){window.location.replace('./');return false}
 const {data,error}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
 if(seq!==loadSequence)return false;
 if(error||!data||data.approved!==true){await supabaseClient.auth.signOut();window.location.replace('./');return false}
 currentRole=data.role;$('account-label').textContent=data.email+(currentRole==='admin'?' · Administrator':'');$('import-link').classList.toggle('hidden',currentRole!=='admin');
 $('app-panel').classList.remove('hidden');
 await loadData();return true;
}
async function loadData(){
 const seq=++loadSequence;
 status($('data-status'),'Loading current MIS data…');
 try{
  const first=await supabaseClient.functions.invoke('vbgramg-mis-data',{body:{page:0,pageSize:200}});
  if(first.error)throw new Error(first.error.message||'Could not load MIS data.');
  const data=first.data;if(!data||data.approved!==true)throw new Error((data&&data.error)||'MIS data access was denied.');
  if(seq!==loadSequence)return;
  $('updated-at').textContent=data.updatedAt?new Date(data.updatedAt).toLocaleString():'—';
  if(!data.hasData||!data.totalRows){allRows=[];headers=[];jobCards=[];selectedApplicants=new Map();renderTable();status($('data-status'),'No MIS data has been imported yet. An administrator can import the MIS worksheet.');return}
  let rows=(data.rows||[]).map(r=>({rowNumber:r.rowNumber,values:Array.isArray(r.values)?r.values:[]}));
  for(let page=1;page<Math.ceil(data.totalRows/200);page++){
   const next=await supabaseClient.functions.invoke('vbgramg-mis-data',{body:{page,pageSize:200}});
   if(next.error)throw new Error(next.error.message||'Could not load all MIS rows.');
   if(!next.data||next.data.approved!==true)throw new Error((next.data&&next.data.error)||'MIS data access was denied.');
   rows=rows.concat((next.data.rows||[]).map(r=>({rowNumber:r.rowNumber,values:Array.isArray(r.values)?r.values:[]})));
  }
  if(seq!==loadSequence)return;
  const sourceHeader=rows.length?rows[0].values:[];
  headers=sourceHeader.map((v,i)=>String(v==null||String(v).trim()===''?'Column '+(i+1):v));
  allRows=rows.slice(1);
  selectedApplicants=await loadSavedSelections();
  if(seq!==loadSequence)return;
  buildJobCards();
  const staleSelectionsRemoved=await pruneStaleSelections();
  if(seq!==loadSequence)return;
  updateKpis();
  currentPage=0;expandedCards=new Set();renderTable();
  status($('data-status'),staleSelectionsRemoved
   ?'MIS data loaded. Cleared '+staleSelectionsRemoved+' saved selection(s) for applicants no longer present.'
   :'MIS data loaded successfully.','success');
 }catch(error){if(seq===loadSequence)status($('data-status'),'Could not load MIS data: '+(error&&error.message?error.message:String(error)),'error')}
 finally{}
}
function normalize(value){return String(value==null?'':value).trim()}
function applicantStableKey(groupKey, values, nameIndex, applicantNoIndex, uniqueIdIndex){
 const uniqueId=normalize(uniqueIdIndex>=0?values[uniqueIdIndex]:'');
 if(uniqueId)return 'uid:'+uniqueId.toLocaleLowerCase();
 const fallback=[groupKey,normalize(applicantNoIndex>=0?values[applicantNoIndex]:''),normalize(nameIndex>=0?values[nameIndex]:'')].map(v=>v.toLocaleLowerCase());
 return 'fallback:'+JSON.stringify(fallback);
}
async function loadSavedSelections(){
 const result=await invokeSelection({action:'get'});
 if(!result||result.approved!==true||!Array.isArray(result.selections))throw new Error('Could not load shared MIS selections.');
 const saved=new Map();
 result.selections.forEach(item=>{if(item&&typeof item.job_card_number==='string'&&typeof item.applicant_key==='string')saved.set(item.job_card_number,item.applicant_key)});
 return saved;
}
async function pruneStaleSelections(){
 const valid=new Map(jobCards.map(group=>[group.key,new Set(group.applicants.map(applicant=>applicant.selectionKey))]));
 const stale=Array.from(selectedApplicants.entries()).filter(([jobCard,applicantKey])=>!valid.has(jobCard)||!valid.get(jobCard).has(applicantKey));
 let removed=0;
 for(const [jobCard,applicantKey] of stale){
  try{
   await invokeSelection({action:'clear',jobCardNumber:jobCard,applicantKey});
   removed++;
  }catch(error){
   console.warn('Could not clear stale MIS selection for job card '+jobCard,error);
  }
 }
 if(removed)selectedApplicants=await loadSavedSelections();
 return removed;
}
async function invokeSelection(payload){
 const {data,error}=await supabaseClient.functions.invoke('vbgramg-mis-selection',{body:payload});
 if(error){
  let message=error.message||'Selection request failed.';
  try{const response=error.context;if(response&&typeof response.json==='function'){const detail=await response.json();if(detail&&detail.error)message=detail.error}}catch(_){}
  throw new Error(message);
 }
 if(data&&data.error)throw new Error(data.error);
 return data;
}
function updateKpis(){
 const totalApplications=allRows.length;
 const validJobCards=jobCards.filter(g=>g.key!=='(Job card number missing)');
 const selectedCount=validJobCards.filter(g=>selectedApplicants.has(g.key)).length;
 $('total-jobcards').textContent=validJobCards.length;
 $('total-applicants').textContent=totalApplications;
 $('total-demand').textContent=selectedCount;
 $('total-unwilling').textContent=Math.max(0,validJobCards.length-selectedCount);
}
function buildJobCards(){
 const jobIndex=headers.findIndex(h=>/^(job card number|jobcard number)$/i.test(h.trim()));
 const fallbackIndex=headers.findIndex(h=>/^jc no\.?$/i.test(h.trim()));
 const householdIndex=headers.findIndex(h=>/head of household/i.test(h));
 const nameIndex=headers.findIndex(h=>/name of applicant|applicant name/i.test(h));
 const applicantNoIndex=headers.findIndex(h=>/applicant no/i.test(h));
 const uniqueIdIndex=headers.findIndex(h=>/^unique id$/i.test(h.trim()));
 const keyIndex=jobIndex>=0?jobIndex:fallbackIndex;
 const groups=new Map();
 allRows.forEach((row,i)=>{
  const values=row.values||[];
  const key=normalize(keyIndex>=0?values[keyIndex]:'')||'(Job card number missing)';
  if(!groups.has(key))groups.set(key,{key,household:normalize(householdIndex>=0?values[householdIndex]:''),applicants:[],firstRow:i});
  const group=groups.get(key);
  if(!group.household&&householdIndex>=0)group.household=normalize(values[householdIndex]);
  group.applicants.push({name:normalize(nameIndex>=0?values[nameIndex]:''),number:normalize(applicantNoIndex>=0?values[applicantNoIndex]:''),selectionKey:applicantStableKey(key,values,nameIndex,applicantNoIndex,uniqueIdIndex),values,rowNumber:row.rowNumber});
 });
 jobCards=Array.from(groups.values());
 updateKpis();
}
function getFilteredCards(){
 const q=$('search-input').value.trim().toLocaleLowerCase(),filter=$('selection-filter').value;
 return jobCards.filter(group=>{
  const hasSelection=selectedApplicants.has(group.key);
  if(filter==='selected'&&!hasSelection)return false;
  if(filter==='none'&&hasSelection)return false;
  return !q||[group.key,group.household,...group.applicants.flatMap(a=>[a.name,a.number,...a.values.map(normalize)])].some(v=>String(v||'').toLocaleLowerCase().includes(q));
 });
}
function renderTable(){
 const filtered=getFilteredCards(),totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage=Math.min(currentPage,totalPages-1);
 const start=currentPage*pageSize,shown=filtered.slice(start,start+pageSize);
 const thead=$('mis-table').querySelector('thead'),tbody=$('mis-table').querySelector('tbody');thead.replaceChildren();tbody.replaceChildren();
 const isMobile=window.matchMedia('(max-width: 700px)').matches;
 const hr=document.createElement('tr');
 (isMobile?['Sl. No.','Job Card Details']:['Sl. No.','Job Card Number','Head of Household','Applicants']).forEach(label=>{const th=document.createElement('th');th.textContent=label;hr.appendChild(th)});
 thead.appendChild(hr);
 shown.forEach((group,visibleIndex)=>{
  const hasSelection=selectedApplicants.has(group.key);
  const tr=document.createElement('tr');tr.className='jobcard-row '+(hasSelection?'has-selection':'no-selection');
  const serialCell=document.createElement('td');serialCell.textContent=String(start+visibleIndex+1);if(isMobile)serialCell.style.verticalAlign='top';tr.appendChild(serialCell);
  const toggleGroup=()=>{if(expandedCards.has(group.key))expandedCards.delete(group.key);else expandedCards.add(group.key);renderTable()};
  tr.tabIndex=0;
  tr.setAttribute('aria-expanded',String(expandedCards.has(group.key)));
  tr.setAttribute('aria-label',(expandedCards.has(group.key)?'Collapse ':'Expand ')+'applicants for job card '+group.key);
  tr.addEventListener('click',toggleGroup);
  tr.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroup()}});
  if(!isMobile){
   const jobCell=document.createElement('td');jobCell.style.fontWeight='700';jobCell.style.whiteSpace='nowrap';jobCell.textContent=group.key;tr.appendChild(jobCell);
   const householdCell=document.createElement('td');householdCell.textContent=group.household||'—';householdCell.style.fontWeight='600';tr.appendChild(householdCell);
   const countCell=document.createElement('td');countCell.textContent=String(group.applicants.length);countCell.style.fontWeight='700';tr.appendChild(countCell);
  }else{
   const detailCell=document.createElement('td');detailCell.style.verticalAlign='top';
   const firstLine=document.createElement('div');firstLine.style.display='flex';firstLine.style.alignItems='center';firstLine.style.justifyContent='space-between';firstLine.style.gap='8px';
   const cardNumber=document.createElement('div');cardNumber.textContent=group.key;cardNumber.style.fontWeight='750';cardNumber.style.fontSize='0.96rem';cardNumber.style.overflowWrap='anywhere';firstLine.appendChild(cardNumber);detailCell.appendChild(firstLine);
   const secondary=document.createElement('div');secondary.style.display='flex';secondary.style.alignItems='center';secondary.style.flexWrap='wrap';secondary.style.gap='4px 14px';secondary.style.marginTop='5px';secondary.style.fontSize='0.82rem';secondary.style.fontWeight='400';secondary.style.color='#64748b';
   const household=document.createElement('span');household.textContent=group.household||'—';secondary.appendChild(household);
   const applicantsMeta=document.createElement('span');applicantsMeta.textContent='Applicants: '+group.applicants.length;secondary.appendChild(applicantsMeta);
   detailCell.appendChild(secondary);tr.appendChild(detailCell);
  }
  tbody.appendChild(tr);
  if(expandedCards.has(group.key)){
   const detailTr=document.createElement('tr');detailTr.className='applicant-detail';const detailTd=document.createElement('td');detailTd.colSpan=isMobile?2:4;detailTd.style.padding='12px 18px 16px 42px';detailTd.style.background='#f8fafc';
   const subtable=document.createElement('table');subtable.style.width='100%';subtable.style.maxWidth='none';subtable.style.tableLayout='fixed';
   const subhead=document.createElement('thead'),subheadRow=document.createElement('tr');
   ['Name of Applicant','Applicant No.',''].forEach((label,index)=>{const th=document.createElement('th');th.textContent=label;th.style.position='static';th.style.background='#e2e8f0';if(index===0)th.style.width='56%';if(index===1)th.style.width='32%';if(index===2){th.style.width='12%';th.style.textAlign='center';th.style.minWidth='52px'}subheadRow.appendChild(th)});subhead.appendChild(subheadRow);subtable.appendChild(subhead);
   const subbody=document.createElement('tbody');
   group.applicants.forEach((applicant)=>{const ar=document.createElement('tr');
    const applicantId=applicant.selectionKey;
    const name=document.createElement('td');name.textContent=applicant.name||'—';name.style.width='56%';name.style.minWidth='0';name.style.overflowWrap='anywhere';ar.appendChild(name);
    const no=document.createElement('td');no.textContent=applicant.number||'—';no.style.width='32%';no.style.minWidth='0';no.style.overflowWrap='anywhere';ar.appendChild(no);
    const selectCell=document.createElement('td');selectCell.style.width='12%';selectCell.style.minWidth='52px';selectCell.style.textAlign='center';
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.style.width='18px';checkbox.style.minHeight='18px';checkbox.style.padding='0';checkbox.style.margin='2px 0';checkbox.checked=selectedApplicants.get(group.key)===applicantId;checkbox.setAttribute('aria-label','Select '+(applicant.name||'applicant')+' for job card '+group.key);
    checkbox.addEventListener('change',async()=>{
     const shouldSelect=checkbox.checked;checkbox.disabled=true;
     try{
      await invokeSelection({action:shouldSelect?'set':'clear',jobCardNumber:group.key,applicantKey:applicantId});
      selectedApplicants=await loadSavedSelections();
      updateKpis();
      status($('data-status'),shouldSelect?'Selection saved for job card '+group.key+'.':'Selection cleared for job card '+group.key+'.','success');
     }catch(error){
      status($('data-status'),'Could not save selection: '+(error&&error.message?error.message:String(error))+'. Reload the page if another user may have changed this selection.','error');
     }
     renderTable();
    });
    selectCell.appendChild(checkbox);ar.appendChild(selectCell);
    subbody.appendChild(ar)});
   subtable.appendChild(subbody);detailTd.appendChild(subtable);detailTr.appendChild(detailTd);tbody.appendChild(detailTr);
  }
 });
 $('table-wrap').classList.toggle('hidden',!headers.length);
 const totalApplicants=filtered.reduce((sum,g)=>sum+g.applicants.length,0);
 $('result-count').textContent=filtered.length+' job card'+(filtered.length===1?'':'s')+' · '+totalApplicants+' applicant'+(totalApplicants===1?'':'s')+(filtered.length!==jobCards.length?' matching search':'');
 $('page-label').textContent=filtered.length?'Showing job cards '+(start+1)+'–'+Math.min(start+pageSize,filtered.length)+' of '+filtered.length:'No matching job cards';
 $('prev-button').disabled=currentPage<=0;$('next-button').disabled=currentPage>=totalPages-1;
}
$('logout-button').addEventListener('click',async()=>{await supabaseClient.auth.signOut();window.location.replace('./')});
$('search-input').addEventListener('input',()=>{currentPage=0;renderTable()});$('selection-filter').addEventListener('change',()=>{currentPage=0;renderTable()});
$('prev-button').addEventListener('click',()=>{currentPage--;renderTable()});$('next-button').addEventListener('click',()=>{currentPage++;renderTable()});
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){loadSequence++;window.location.replace('./')}else if(event==='TOKEN_REFRESHED'&&session)Promise.resolve().then(()=>verifyAccess(session.user))});
supabaseClient.auth.getSession().then(({data,error})=>{if(error||!data.session){window.location.replace('./');return}return verifyAccess(data.session.user)});
</script></body></html>
