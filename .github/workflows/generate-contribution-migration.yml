name: Generate contribution migration filename

on:
  push:
    branches:
      - phase1-atomic-contribution-writes
    paths:
      - ".github/workflows/generate-contribution-migration.yml"

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: phase1-atomic-contribution-writes
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v3.stable

      - name: Generate timestamped migration with Supabase CLI
        run: |
          supabase --version
          supabase migration --help
          supabase init
          supabase migration new record_contribution_transaction
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_record_contribution_transaction.sql' -print -quit)"
          test -n "$migration_file"
          echo "Generated: $migration_file"
          test ! -s "$migration_file"

      - name: Commit generated migration filename to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_record_contribution_transaction.sql
          git commit -m "Create timestamped contribution transaction migration"
          git push origin HEAD:phase1-atomic-contribution-writes
