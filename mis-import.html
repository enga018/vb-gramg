<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>MIS Import — VBGRAMG</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: #f1f5f9; color: #0f172a; }
    main { width: min(100%, 1100px); margin: 0 auto; padding: clamp(20px, 4vw, 32px); background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    p { color: #475569; line-height: 1.5; margin: 0 0 20px; }
    .paste-box { padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; margin: 18px 0 14px; }
    .file-label { display: block; margin-bottom: 10px; font-weight: 650; }
    .hint { margin-top: 8px; font-size: .85rem; color: #64748b; }
    textarea { display:block; width:100%; min-height:190px; resize:vertical; font:inherit; font-size:.92rem; line-height:1.45; padding:12px; border:1px solid #cbd5e1; border-radius:8px; }
    textarea:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
    input[type=email], input[type=password] { display:block; width:100%; min-height:44px; margin:8px 0 12px; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
    button { width: 100%; min-height: 48px; padding: 12px 16px; border: 0; border-radius: 10px; background: #0f172a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { margin-top: 8px; background: #e2e8f0; color: #0f172a; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .status { margin-top: 16px; padding: 12px 14px; background: #f8fafc; border-radius: 10px; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .status.success { background: #f0fdf4; color: #166534; }
    .table-wrap { overflow: auto; overscroll-behavior: contain; max-height: 68vh; margin-top: 16px; border: 1px solid #dfe5ee; border-radius: 12px; background: #fff; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9rem; white-space: normal; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #edf0f5; text-align: left; vertical-align: middle; min-width: 100px; max-width: 420px; overflow-wrap: anywhere; }
    th { position: sticky; top: 0; background: #f5f7fb; color: #5b6577; z-index: 1; font-size: .72rem; letter-spacing: .055em; text-transform: uppercase; font-weight: 750; }
    tbody tr:last-child td { border-bottom: 0; }
    .jobcard-row { background: #fff; cursor: pointer; }
    .jobcard-row:hover { background: #f6f9ff; }
    .jobcard-row:focus-visible { outline: 2px solid #3972df; outline-offset: -2px; }
    .applicant-detail td { background: #f8fafd; }
    .applicant-detail table { width: 100%; table-layout: fixed; border: 1px solid #e3e8f0; border-radius: 9px; }
    .applicant-detail th { position: static; background: #edf2f8; }
    .applicant-detail tbody tr:nth-child(even) { background: #fff; }
    .table-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:14px; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .table-foot .actions button { width:auto; min-height:42px; margin:0; background:#e2e8f0; color:#0f172a; }
    .hidden { display: none !important; }
    @media(max-width:700px) {
      body { padding:10px; }
      main { padding:16px; border-radius:13px; }
      .table-wrap { max-height:65vh; }
      table { font-size:.84rem; }
      th,td { padding:11px 10px; }
      th { font-size:.68rem; }
      .table-foot { align-items:stretch; }
      .table-foot .actions { display:grid; grid-template-columns:1fr 1fr; width:100%; }
      .table-foot .actions button { width:100%; }
    }
    .signed-in { font-size: .9rem; overflow-wrap: anywhere; margin: 0 0 12px; }
    .diff-panel { margin-top: 18px; padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; }
    .diff-summary { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 10px; margin: 12px 0; }
    .diff-count { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: white; }
    .diff-count strong { display:block; font-size:1.35rem; }
    .diff-list { max-height: 220px; overflow:auto; padding-left: 22px; font-size:.9rem; }
    .diff-list li { margin: 6px 0; overflow-wrap:anywhere; }
    .diff-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .diff-actions button { flex:1; min-width:150px; }
    button.danger { background:#991b1b; color:#fff; }
  
/* Consistent page header: title left, navigation/actions right. */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header .brand,.app-header .page-title{flex:0 1 auto;min-width:0}
.app-header .brand h1,.app-header .page-title h1,.app-header>div:first-child h1{margin:0;font-size:1.35rem;line-height:1.25;letter-spacing:-.025em}
.app-header .brand p,.app-header .page-title p,.app-header>div:first-child p{margin:3px 0 0}
.app-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;flex-wrap:wrap;margin-left:auto}
.app-header-actions>*{white-space:nowrap}
.app-header-actions .menu-link{order:0}
@media(max-width:700px){.app-header{gap:12px;padding:14px 16px}.app-header-actions{width:100%;justify-content:flex-end;gap:7px}.app-header-actions>*{min-height:39px;padding:8px 11px;font-size:.84rem}.app-header .brand h1,.app-header .page-title h1,.app-header>div:first-child h1{font-size:1.25rem}}

/* Shared page header styling for MIS Import. */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;width:min(100%,1100px);margin:0 auto 14px;padding:16px 20px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 24px rgb(15 23 42 / 5%)}
.app-header .brand h1{margin:0;font-size:1.35rem;line-height:1.25;letter-spacing:-.025em}
.app-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}
.app-header-actions>*{white-space:nowrap}
.app-header-actions a{font:inherit;font-size:.9rem;font-weight:650;min-height:40px;padding:9px 13px;border:1px solid #e0e6ef;border-radius:10px;background:#f0f3f8;color:#344054;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
@media(max-width:700px){body{padding:10px}.topbar{padding:14px 15px}.app-header-actions{width:100%;justify-content:flex-end}.app-header-actions>*{min-height:39px;padding:8px 11px;font-size:.84rem}main{padding:16px}}

/* Keep every header action visually consistent with the standard Refresh button. */
header .account > button,
header .app-header-actions > a,
header .app-header-actions > button,
header .top-actions > a,
header .top-actions > button {
  box-sizing: border-box !important;
  min-height: 40px !important;
  padding: 9px 12px !important;
  border: 1px solid #cbd5e1 !important;
  border-radius: 10px !important;
  background: #e2e8f0 !important;
  color: #0f172a !important;
  font-family: inherit !important;
  font-size: .9rem !important;
  font-weight: 650 !important;
  line-height: 1.2 !important;
  text-decoration: none !important;
  box-shadow: none !important;
  transform: none !important;
}
header .account > button:hover,
header .app-header-actions > a:hover,
header .app-header-actions > button:hover,
header .top-actions > a:hover,
header .top-actions > button:hover {
  background: #d7e0ec !important;
  color: #0f172a !important;
}


/* Standardize mobile table font size across app tables. */
@media (max-width:700px){
  table, table th, table td { font-size:0.85rem !important; }
}
.page-actions-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin:0 auto 16px;width:min(100%,1440px)}.page-actions-bar>*{flex-shrink:0}@media(max-width:700px){.page-actions-bar{justify-content:stretch}.page-actions-bar>*{flex:1 1 auto}}

/* Shared desktop content width across every VBGRAMG page. */
:root{--app-content-width:1440px}
body>main{width:min(100%,var(--app-content-width));max-width:var(--app-content-width);margin-left:auto;margin-right:auto;box-sizing:border-box}
body>header.topbar,body>.topbar,body>.page-actions-bar,body>.top-actions{width:min(100%,var(--app-content-width));max-width:var(--app-content-width);margin-left:auto;margin-right:auto;box-sizing:border-box}

/* Responsive MIS comparison: table on desktop, readable change cards on mobile. */
.diff-mobile-cards{display:grid;gap:10px;margin-top:12px}.diff-mobile-cards[hidden]{display:none}
.diff-change-card{padding:13px;border:1px solid #334155;border-radius:12px;background:#1b232d;color:#e2e8f0}
.diff-card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.diff-card-job{font-weight:750;overflow-wrap:anywhere;margin-bottom:9px}
.diff-card-field{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #334155;font-size:.9rem}
.diff-card-field span,.diff-card-previous span{color:#aab6c5}
.diff-card-field strong{text-align:right;overflow-wrap:anywhere}
.diff-card-previous{margin-top:9px;padding:9px;border-radius:8px;background:#111820}
.diff-card-previous p{margin:5px 0 0;overflow-wrap:anywhere}
.diff-added .diff-card-heading strong{color:#6ee7b7}
.diff-deleted .diff-card-heading strong{color:#fca5a5}
.diff-updated .diff-card-heading strong{color:#fcd34d}
@media(min-width:701px){.diff-mobile-cards{display:none!important}}

</style>
  <link rel="stylesheet" href="./responsive.css?v=20261118-theme-toggle">
<link rel="stylesheet" href="./theme.css?v=20261118-theme-toggle">
<link rel="stylesheet" href="./button-system.css?v=20261114-button-sizing">
</head>
<body>
  <main>
  
    <div class="paste-box">
      <button type="button" id="fetch-official-mis-button">Fetch Official MIS</button>
      <div id="official-fetch-status" class="hint" aria-live="polite"></div>
    </div>
    <div id="status" class="status" aria-live="polite">Checking administrator access…</div>
    <section id="diff-panel" class="diff-panel hidden" aria-live="polite">
      <h2 id="diff-title">Official MIS update complete</h2>
      <div class="diff-summary">
        <div class="diff-count"><span>Added</span><strong id="diff-added-count">0</strong></div>
        <div class="diff-count"><span>Deleted</span><strong id="diff-deleted-count">0</strong></div>
        <div class="diff-count"><span>Updated</span><strong id="diff-updated-count">0</strong></div>
        <div class="diff-count"><span>Unchanged</span><strong id="diff-unchanged-count">0</strong></div>
      </div>
      <h3>Applicant changes</h3>
      <div class="table-wrap diff-table-wrap"><table class="diff-table">
        <thead><tr><th>Change</th><th>Job Card No.</th><th>Head of Household</th><th>Applicant Name</th><th>Applicant No.</th><th>Previous details</th></tr></thead>
        <tbody id="diff-table-body"><tr><td colspan="6">No applicant changes detected.</td></tr></tbody>
      </table></div>
      <div id="diff-mobile-cards" class="diff-mobile-cards" hidden></div>
      <div id="diff-pager" class="mobile-table-pager" hidden><button id="diff-prev" class="secondary" type="button">Previous</button><span id="diff-page-label"></span><button id="diff-next" class="secondary" type="button">Next</button></div>
      <div class="diff-actions"><button id="diff-okay-button" type="button">Okay</button></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const statusBox=document.getElementById('status'),fetchButton=document.getElementById('fetch-official-mis-button'),fetchStatus=document.getElementById('official-fetch-status');
    let currentUser=null,currentRole=null,latestDiff=null,diffPage=0,startRequested=false;
    const pageSize=10;
    function setStatus(message,type){statusBox.textContent=message;statusBox.classList.remove('error','success');if(type)statusBox.classList.add(type);}
    async function invokeImport(payload){
      const {data,error}=await supabaseClient.functions.invoke('vbgramg-mis-import',{body:payload});
      if(error){let message=error.message||'Supabase function request failed.';try{const r=error.context;if(r&&typeof r.json==='function'){const d=await r.json();if(d&&d.error)message=d.error;}}catch(_){}throw new Error(message);}
      if(data&&data.error)throw new Error(data.error);return data;
    }
    async function updateAuthUI(user){
      currentUser=null;currentRole=null;
      if(!user){setStatus('Administrator access is required. Redirecting to the main app…','error');window.location.replace('./');return;}
      const {data:access,error}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
      if(error||!access||access.approved!==true||access.role!=='admin'){setStatus('Administrator access is required. Returning to the main app…','error');window.location.replace('./');return;}
      currentUser=user;currentRole=access.role;fetchButton.disabled=false;setStatus('Administrator access verified. Ready to fetch the official MIS.');if(startRequested){startRequested=false;fetchButton.click();}
    }
    const label=item=>[item.jobCardNumber&&'Job card '+item.jobCardNumber,item.household&&'Household '+item.household,item.applicantName,item.applicantNo&&'Applicant No. '+item.applicantNo,item.uniqueId&&'ID '+item.uniqueId].filter(Boolean).join(' · ')||'Applicant record';
    function cell(row,value){const td=document.createElement('td');td.textContent=value==null||value===''?'—':String(value);row.appendChild(td);}
    function renderDiff(diff){
      const body=document.getElementById('diff-table-body'),cards=document.getElementById('diff-mobile-cards');body.replaceChildren();cards.replaceChildren();
      const entries=[...diff.added.map(item=>({type:'Added',item})),...diff.deleted.map(item=>({type:'Deleted',item})),...diff.updated.map(change=>({type:'Updated',item:change.after||{},previous:change.before||{}}))];
      const mobile=matchMedia('(max-width:700px)').matches,pages=Math.max(1,Math.ceil(entries.length/pageSize));
      document.querySelector('.diff-table-wrap').hidden=mobile||!entries.length;cards.hidden=!mobile||!entries.length;
      if(!entries.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.textContent='No applicant changes detected.';tr.appendChild(td);body.appendChild(tr);}
      diffPage=Math.min(diffPage,pages-1);
      const shown=mobile?entries.slice(diffPage*pageSize,(diffPage+1)*pageSize):entries;
      shown.forEach(({type,item,previous})=>{
        const tr=document.createElement('tr');[type,item.jobCardNumber,item.household,item.applicantName,item.applicantNo,previous?label(previous):'—'].forEach(v=>cell(tr,v));body.appendChild(tr);
        if(mobile){const card=document.createElement('article');card.className='diff-change-card diff-'+type.toLowerCase();const h=document.createElement('div');h.className='diff-card-heading';const strong=document.createElement('strong');strong.textContent=type;h.appendChild(strong);card.appendChild(h);const job=document.createElement('div');job.className='diff-card-job';job.textContent=item.jobCardNumber||'Job card not available';card.appendChild(job);
          [['Head of household',item.household],['Applicant name',item.applicantName],['Applicant no.',item.applicantNo]].forEach(([k,v])=>{const line=document.createElement('div');line.className='diff-card-field';const a=document.createElement('span');a.textContent=k;const b=document.createElement('strong');b.textContent=v==null||v===''?'—':String(v);line.append(a,b);card.appendChild(line);});
          if(previous){const p=document.createElement('div');p.className='diff-card-previous';const a=document.createElement('span');a.textContent='Previous details';const b=document.createElement('p');b.textContent=label(previous);p.append(a,b);card.appendChild(p);}cards.appendChild(card);}
      });
      document.getElementById('diff-pager').hidden=!mobile||entries.length<=pageSize;document.getElementById('diff-page-label').textContent='Page '+(diffPage+1)+' of '+pages;document.getElementById('diff-prev').disabled=diffPage<=0;document.getElementById('diff-next').disabled=diffPage>=pages-1;
    }
    function showResult(result){
      latestDiff=result;diffPage=0;
      document.getElementById('diff-added-count').textContent=Number(result.added?.length||0).toLocaleString();
      document.getElementById('diff-deleted-count').textContent=Number(result.deleted?.length||0).toLocaleString();
      document.getElementById('diff-updated-count').textContent=Number(result.updated?.length||0).toLocaleString();
      document.getElementById('diff-unchanged-count').textContent=Number(result.unchanged||0).toLocaleString();
      renderDiff(result);document.getElementById('diff-panel').classList.remove('hidden');
      // Refresh the parent MIS immediately after confirmed activation, even if
      // the administrator closes the dialog without pressing Okay.
      if(window.parent!==window)window.parent.postMessage({type:'vbgramg-mis-import-complete'},window.location.origin);
    }
    fetchButton.disabled=true;
    fetchButton.addEventListener('click',async()=>{
      if(!currentUser||currentRole!=='admin'){setStatus('Administrator access is required.','error');return;}
      fetchButton.disabled=true;fetchStatus.textContent='Fetching, validating, comparing and activating the official Government MIS…';setStatus('Official MIS update in progress. Keep this page open.');document.getElementById('diff-panel').classList.add('hidden');
      try{const result=await invokeImport({action:'official-fetch'});if(!result||result.success!==true||result.activated!==true)throw new Error('The server did not confirm successful MIS activation.');
        fetchStatus.textContent='Official Government MIS fetched and activated successfully.';setStatus('Official MIS update completed successfully.','success');showResult(result);
      }catch(error){const message=error&&error.message?error.message:String(error);fetchStatus.textContent='Fetch failed: '+message;const uncertain=message.toLowerCase().includes('activation status could not be verified');setStatus(uncertain?'Import outcome is uncertain. Do not retry yet; refresh the MIS page and verify which import is active. '+message:'Official MIS update failed. The previous active MIS has been preserved. '+message,'error');}
      finally{
        // Keep the fetch action locked while the successful result awaits acknowledgement.
        if(document.getElementById('diff-panel').classList.contains('hidden'))fetchButton.disabled=false;
      }
    });
    window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data&&event.data.type==='vbgramg-start-official-mis-fetch'){startRequested=true;if(currentUser&&currentRole==='admin'&&!fetchButton.disabled){startRequested=false;fetchButton.click();}}});
    document.getElementById('diff-prev').addEventListener('click',()=>{diffPage=Math.max(0,diffPage-1);if(latestDiff)renderDiff(latestDiff);});
    document.getElementById('diff-next').addEventListener('click',()=>{diffPage++;if(latestDiff)renderDiff(latestDiff);});
    document.getElementById('diff-okay-button').addEventListener('click',()=>{
      document.getElementById('diff-panel').classList.add('hidden');
      fetchButton.disabled=!(currentUser&&currentRole==='admin');
    });
    setStatus('Checking your sign-in session…');
    (async()=>{try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;setStatus('Verifying administrator permissions…');await updateAuthUI(data.session?data.session.user:null);}catch(error){setStatus('Could not verify administrator access: '+(error.message||String(error))+'. Reload the page or sign in again.','error');}})();
    supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')updateAuthUI(session?session.user:null);});
  </script>
<script src="./toast.js?v=20261103"></script><script src="./navigation.js?v=20261118-theme-toggle"></script>
</body>
</html>
