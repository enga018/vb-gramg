name: Verify Supabase CLI setup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-contribution-function.yml"
      - ".github/workflows/verify-supabase-cli.yml"

permissions:
  contents: read

jobs:
  verify-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Verify CLI installation
        run: supabase --version
