name: Headless MIS fetch (preview only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mis-headless-fetch
  cancel-in-progress: false

jobs:
  fetch-mis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Fetch official MIS in headless Chrome
        run: python scripts/fetch_mis_preview.py

      - name: Upload preview or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-headless-preview
          path: output/*
          if-no-files-found: warn
          retention-days: 7
