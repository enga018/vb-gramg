<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>VBGRAMG Tools</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; }
    main { width: min(100%, 620px); padding: 32px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
    p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    .section { margin-top: 24px; }
    .buttons { display: grid; grid-template-columns: 1fr; gap: 12px; }
    button { width: 100%; min-height: 54px; padding: 14px 18px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; color: #0f172a; font: inherit; font-weight: 650; cursor: pointer; text-align: left; }
    button:hover { background: #f8fafc; border-color: #64748b; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .subtitle { display: block; margin-top: 4px; font-size: .875rem; font-weight: 400; color: #64748b; }
    .note { margin: 20px 0 0; font-size: .875rem; color: #64748b; }
    @media (min-width: 480px) { .buttons { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>VBGRAMG Tools</h1>
    <p>Choose which system you want to open.</p>

    <section>
      <h2>Choose system</h2>
      <div class="buttons">
        <button type="button" id="nrega-button">
          NREGA / NREGASoft
          <span class="subtitle">Open the existing NREGA system</span>
        </button>
        <button type="button" id="vbgramg-button">
          VB-G RAM G
          <span class="subtitle">Open the VBGRAMG system</span>
        </button>
      </div>
    </section>

    <section class="section">
      <h2>Other tools</h2>
      <div class="buttons">
        <button type="button" id="mis-button">MIS (blank page for now)</button>
        <button type="button" id="button-2">Button 2</button>
      </div>
    </section>

    <p class="note">Both systems open in a new tab with New Serchhip North Panchayat and financial year 2026–2027 selected in the URL.</p>
  </main>
  <script>
    document.getElementById('nrega-button').addEventListener('click', function () {
      window.open('https://mnregaweb2.dord.gov.in/netnrega/IndexFrame.aspx?lflag=eng&District_Code=2207&district_name=SERCHHIP&state_name=MIZORAM&state_Code=22&block_name=serchhip&block_code=2207001&fin_year=2026-2027&check=1&Panchayat_name=NEW+SERCHHIP+North&Panchayat_Code=2207001005', '_blank', 'noopener,noreferrer');
    });
    document.getElementById('vbgramg-button').addEventListener('click', function () {
      window.open('https://vbgramgrep.dord.gov.in/VBGRAMG/IndexFrame.aspx?lflag=eng&District_Code=2207&district_name=SERCHHIP&state_name=MIZORAM&state_Code=22&block_name=serchhip&block_code=2207001&fin_year=2026-2027&check=1&Panchayat_name=NEW+SERCHHIP+North&Panchayat_Code=2207001005', '_blank', 'noopener,noreferrer');
    });
    document.getElementById('mis-button').addEventListener('click', function () {
      window.open('about:blank', '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
