<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f172a">
<title>MIS — VBGRAMG</title>
<style>
:root{
 color-scheme:light;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:#172033;
 background:#f3f6fb;
 --ink:#172033;
 --muted:#667085;
 --line:#e3e8f0;
 --surface:#fff;
 --surface-soft:#f7f9fc;
 --accent:#2457c5;
 --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;background:#f3f6fb}
main{width:min(100%,1440px);margin:0 auto}
.topbar,.panel{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:var(--radius);
 box-shadow:0 4px 18px rgb(23 32 51 / 4%);
}
.topbar{
 display:flex;gap:18px;align-items:center;justify-content:space-between;
 padding:18px 22px;margin-bottom:18px;flex-wrap:wrap;
}
.brand h1{font-size:1.45rem;letter-spacing:-.035em;margin:0 0 5px;color:var(--ink)}
.brand p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.45}
.brand a{text-decoration:none}
.brand a:hover{text-decoration:underline}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:0 1 auto;min-width:0;flex-wrap:wrap}
.header-actions-label{font-size:.86rem;color:#475467;overflow-wrap:anywhere}
.panel{padding:clamp(18px,2.5vw,28px)}
h2{margin:0 0 6px;font-size:1.18rem;letter-spacing:-.02em;color:var(--ink)}
p{color:var(--muted);line-height:1.5}
label{display:block;font-size:.88rem;font-weight:650;margin:0 0 7px;color:#344054}
input,select{font:inherit;min-height:44px;padding:10px 12px;border:1px solid #cfd7e4;border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid rgb(36 87 197 / 15%);border-color:#6f91dc}
button,.link-button{
 font:inherit;font-size:.9rem;font-weight:650;border:1px solid transparent;border-radius:10px;
 min-height:42px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer;
 text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
 transition:background .15s,border-color .15s,transform .15s;
}
button:hover,.link-button:hover{background:#2c3b55}
button.secondary,.link-button.secondary{background:#f0f3f8;color:#344054;border-color:#e0e6ef}
button.secondary:hover,.link-button.secondary:hover{background:#e6ebf3}
button:focus-visible,.link-button:focus-visible{outline:3px solid rgb(36 87 197 / 25%);outline-offset:2px}
button:disabled{opacity:.48;cursor:not-allowed}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login-card{max-width:460px;margin:7vh auto}
.hidden{display:none!important}
.status{margin:14px 0 0;padding:11px 13px;border:1px solid #e5eaf2;border-radius:10px;background:#f7f9fc;color:#475467;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;line-height:1.45}
.status.error{background:#fff4f2;border-color:#ffd8d2;color:#a12b20}
.status.success{background:#effaf3;border-color:#ccebd7;color:#17663a}
.toolbar{display:flex;gap:14px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:22px 0 14px}
.search{flex:1;min-width:220px;max-width:620px}
.filter-control{min-width:180px}
.filter-control select{padding-right:34px}
.meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;margin-bottom:7px;line-height:1.3}
.stat strong{display:block;font-size:1.08rem;font-weight:750;letter-spacing:-.02em;line-height:1.35;overflow-wrap:anywhere;color:var(--ink)}
#updated-at{font-size:.88rem;font-weight:650;letter-spacing:0}
.muted{font-size:.84rem;color:var(--muted);line-height:1.45}
.table-wrap{overflow:auto;overscroll-behavior:contain;max-height:68vh;border:1px solid #dfe5ee;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgb(23 32 51 / 3%)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem;white-space:normal}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:middle;min-width:100px;max-width:420px;overflow-wrap:anywhere}
th{position:sticky;top:0;z-index:1;background:#f5f7fb;color:#5b6577;font-size:.72rem;letter-spacing:.055em;text-transform:uppercase;font-weight:750}
tbody tr:last-child td{border-bottom:0}
.jobcard-row{background:#fff;cursor:pointer;transition:background .15s}
.jobcard-row:hover{background:#f6f9ff}
.jobcard-row:active{background:#edf3ff}
.jobcard-row:focus-visible{outline:2px solid #3972df;outline-offset:-2px}
.jobcard-row.has-selection{box-shadow:inset 3px 0 #16a34a}
.jobcard-row.no-selection{box-shadow:inset 3px 0 #e9a23b}
.applicant-detail td{background:#f8fafd}
.applicant-detail table{border:1px solid #e3e8f0;border-radius:9px;overflow:hidden}
.applicant-detail th{background:#edf2f8}
.applicant-detail tbody tr:nth-child(even){background:#fff}
.applicant-detail tbody tr:hover{background:#f3f7ff}
.applicant-detail input[type=checkbox]{accent-color:#2457c5;cursor:pointer}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.section-head{display:flex;align-items:start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-head p{margin:4px 0 0;max-width:780px;font-size:.91rem}
@media(max-width:900px){
 .meta{grid-template-columns:repeat(3,minmax(0,1fr))}
 .stat:last-child{grid-column:span 1}
}
@media(max-width:700px){
 body{padding:10px}
 .topbar{padding:15px;gap:14px;border-radius:13px;margin-bottom:12px}
 .brand h1{font-size:1.3rem}
 .brand p{font-size:.82rem}
 .header-actions{width:100%;justify-content:flex-start;gap:8px}
 .header-actions-label{flex:1;min-width:0;font-size:.8rem}
 .header-actions .link-button,.header-actions button{flex:0 0 auto;min-height:40px;padding:9px 12px}
 .panel{padding:14px;border-radius:13px}
 .section-head p{font-size:.86rem}
 .meta{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:15px 0}
 .stat{padding:11px 12px;border-radius:10px}
 .stat small{font-size:.74rem;margin-bottom:5px}
 .stat strong{font-size:1rem}
 .stat:last-child{grid-column:span 2}
 #updated-at{font-size:.82rem}
 .toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:18px 0 12px}
 .search,.filter-control{min-width:0;max-width:none;width:100%}
 .toolbar label{margin-bottom:6px}
 #result-count{margin-top:0}
 .table-wrap{max-height:65vh;border-radius:10px}
 table{font-size:.84rem}
 th,td{padding:11px 10px}
 th{font-size:.68rem}
 
 .jobcard-row td{padding-top:12px;padding-bottom:12px}
 .applicant-detail td{padding:10px!important}
 .applicant-detail th{font-size:.64rem;letter-spacing:.025em}
 .applicant-detail td{font-size:.8rem}
 .applicant-detail input[type=checkbox]{width:20px!important;height:20px;min-height:20px!important}
 .table-foot{align-items:stretch;margin-top:12px}
 .table-foot .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .table-foot .actions button{width:100%}
}
@media(max-width:360px){
 body{padding:7px}
 .panel{padding:11px}
 .header-actions .link-button,.header-actions button{padding:8px 9px;font-size:.82rem}
 .stat{padding:10px}
 .stat strong{font-size:.94rem}
 th,td{padding:9px 8px}
}

/* Consistent page header: title left, navigation/actions right. */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-header .brand,.app-header .page-title{flex:0 1 auto;min-width:0}
.app-header .brand h1,.app-header .page-title h1,.app-header>div:first-child h1{margin:0;font-size:1.35rem;line-height:1.25;letter-spacing:-.025em}
.app-header .brand p,.app-header .page-title p,.app-header>div:first-child p{margin:3px 0 0}
.app-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;flex-wrap:wrap;margin-left:auto}
.app-header-actions>*{white-space:nowrap}
.app-header-actions .menu-link{order:0}
@media(max-width:700px){.app-header{gap:12px;padding:14px 16px}.app-header-actions{width:100%;justify-content:flex-end;gap:7px}.app-header-actions>*{min-height:39px;padding:8px 11px;font-size:.84rem}.app-header .brand h1,.app-header .page-title h1,.app-header>div:first-child h1{font-size:1.25rem}}
</style>
</head>
<body>
<main>
<div id="app-panel" class="hidden">
<header class="topbar app-header"><div class="brand"><h1>MIS</h1><p>Search job cards and manage applicant selections.</p></div><div class="header-actions app-header-actions" aria-label="MIS actions"><a class="link-button secondary menu-link" href="./">Back to menu</a><a id="import-link" class="link-button hidden" href="./mis-import.html">Import</a></div></header>
<section class="panel">
<div class="meta"><div class="stat"><small>Total Job Card</small><strong id="total-jobcards">—</strong></div><div class="stat"><small>Total Applicants from MIS</small><strong id="total-applicants">—</strong></div><div class="stat"><small>Demand</small><strong id="total-demand">—</strong></div><div class="stat"><small>Unwilling</small><strong id="total-unwilling">—</strong></div><div class="stat"><small>Last Updated</small><strong id="updated-at">—</strong></div></div>
<div class="toolbar"><div class="search"><label for="search-input">Search job cards or applicants</label><input id="search-input" type="search" placeholder="Job card number, household, applicant name or number…"></div><div class="filter-control"><label for="selection-filter">Selection status</label><select id="selection-filter"><option value="all">All job cards</option><option value="selected">Selected</option><option value="none">None selected</option></select></div><span id="result-count" class="muted"></span></div>
<div id="data-status" class="status" aria-live="polite">Loading MIS data…</div>
<div id="table-wrap" class="table-wrap hidden"><table id="mis-table"><thead></thead><tbody></tbody></table></div>
<div class="table-foot"><span id="page-label" class="muted"></span><div class="actions"><button id="prev-button" class="secondary" type="button">Previous</button><button id="next-button" class="secondary" type="button">Next</button></div></div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://trtzhafgvqosjwrgckty.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IzELPnGRMeGamS8jQva55w_hJaL44rb';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let currentRole=null,allRows=[],headers=[],jobCards=[],currentPage=0,pageSize=50,loadSequence=0,expandedCards=new Set(),selectedApplicants=new Map(),scrollExpandedCardKey=null;
function status(el,msg,type){el.textContent=msg;el.classList.toggle('error',type==='error');el.classList.toggle('success',type==='success')}
async function verifyAccess(user){
 const seq=++loadSequence;
 if(!user){window.location.replace('./');return false}
 const {data,error}=await supabaseClient.functions.invoke('vbgramg-app-access',{body:{}});
 if(seq!==loadSequence)return false;
 if(error||!data||data.approved!==true){await supabaseClient.auth.signOut();window.location.replace('./');return false}
 currentRole=data.role;$('import-link').classList.toggle('hidden',currentRole!=='admin');
 $('app-panel').classList.remove('hidden');
 await loadData();return true;
}
async function loadData(){
 const seq=++loadSequence;
 status($('data-status'),'Loading current MIS data…');
 try{
  const fetchPageSize=1000,concurrentPageRequests=4;
  const first=await supabaseClient.functions.invoke('vbgramg-mis-data',{body:{page:0,pageSize:fetchPageSize}});
  if(first.error)throw new Error(first.error.message||'Could not load MIS data.');
  const data=first.data;if(!data||data.approved!==true)throw new Error((data&&data.error)||'MIS data access was denied.');
  if(seq!==loadSequence)return;
  $('updated-at').textContent=data.updatedAt?new Date(data.updatedAt).toLocaleString():'—';
  if(!data.hasData||!data.totalRows){allRows=[];headers=[];jobCards=[];selectedApplicants=new Map();renderTable();status($('data-status'),'No MIS data has been imported yet. An administrator can import the MIS worksheet.');return}
  const rows=(data.rows||[]).map(r=>({rowNumber:r.rowNumber,values:Array.isArray(r.values)?r.values:[]}));
  const totalPages=Math.ceil(data.totalRows/fetchPageSize);
  for(let firstPage=1;firstPage<totalPages;firstPage+=concurrentPageRequests){
   const pages=Array.from({length:Math.min(concurrentPageRequests,totalPages-firstPage)},(_,index)=>firstPage+index);
   const results=await Promise.all(pages.map(page=>supabaseClient.functions.invoke('vbgramg-mis-data',{body:{page,pageSize:fetchPageSize}})));
   if(seq!==loadSequence)return;
   for(let index=0;index<results.length;index++){
    const next=results[index];
    if(next.error)throw new Error(next.error.message||'Could not load all MIS rows.');
    if(!next.data||next.data.approved!==true)throw new Error((next.data&&next.data.error)||'MIS data access was denied.');
    rows.push(...(next.data.rows||[]).map(r=>({rowNumber:r.rowNumber,values:Array.isArray(r.values)?r.values:[]})));
   }
  }
  const sourceHeader=rows.length?rows[0].values:[];
  headers=sourceHeader.map((v,i)=>String(v==null||String(v).trim()===''?'Column '+(i+1):v));
  allRows=rows.slice(1);
  selectedApplicants=await loadSavedSelections();
  if(seq!==loadSequence)return;
  buildJobCards();
  const staleSelectionsRemoved=await pruneStaleSelections();
  if(seq!==loadSequence)return;
  updateKpis();
  currentPage=0;expandedCards=new Set();renderTable();
  status($('data-status'),staleSelectionsRemoved
   ?'MIS data loaded. Cleared '+staleSelectionsRemoved+' saved selection(s) for applicants no longer present.'
   :'MIS data loaded successfully.','success');
 }catch(error){if(seq===loadSequence)status($('data-status'),'Could not load MIS data: '+(error&&error.message?error.message:String(error)),'error')}
 finally{}
}
function normalize(value){return String(value==null?'':value).trim()}
function money(value){return '₹'+(Number(value)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function applicantStableKey(groupKey, values, nameIndex, applicantNoIndex, uniqueIdIndex){
 const uniqueId=normalize(uniqueIdIndex>=0?values[uniqueIdIndex]:'');
 if(uniqueId)return 'uid:'+uniqueId.toLocaleLowerCase();
 const fallback=[groupKey,normalize(applicantNoIndex>=0?values[applicantNoIndex]:''),normalize(nameIndex>=0?values[nameIndex]:'')].map(v=>v.toLocaleLowerCase());
 return 'fallback:'+JSON.stringify(fallback);
}
async function loadSavedSelections(){
 const result=await invokeSelection({action:'get'});
 if(!result||result.approved!==true||!Array.isArray(result.selections))throw new Error('Could not load shared MIS selections.');
 const saved=new Map();
 result.selections.forEach(item=>{if(item&&typeof item.job_card_number==='string'&&typeof item.applicant_key==='string')saved.set(item.job_card_number,item.applicant_key)});
 return saved;
}
async function pruneStaleSelections(){
 const valid=new Map(jobCards.map(group=>[group.key,new Set(group.applicants.map(applicant=>applicant.selectionKey))]));
 const stale=Array.from(selectedApplicants.entries()).filter(([jobCard,applicantKey])=>!valid.has(jobCard)||!valid.get(jobCard).has(applicantKey));
 let removed=0;
 for(const [jobCard,applicantKey] of stale){
  try{
   await invokeSelection({action:'clear',jobCardNumber:jobCard,applicantKey});
   removed++;
  }catch(error){
   console.warn('Could not clear stale MIS selection for job card '+jobCard,error);
  }
 }
 if(removed)selectedApplicants=await loadSavedSelections();
 return removed;
}
async function invokeSelection(payload){
 const {data,error}=await supabaseClient.functions.invoke('vbgramg-mis-selection',{body:payload});
 if(error){
  let message=error.message||'Selection request failed.';
  try{const response=error.context;if(response&&typeof response.json==='function'){const detail=await response.json();if(detail&&detail.error)message=detail.error}}catch(_){}
  throw new Error(message);
 }
 if(data&&data.error)throw new Error(data.error);
 return data;
}
function updateKpis(){
 const totalApplications=allRows.length;
 const validJobCards=jobCards.filter(g=>g.key!=='(Job card number missing)');
 const selectedCount=validJobCards.filter(g=>selectedApplicants.has(g.key)).length;
 $('total-jobcards').textContent=validJobCards.length;
 $('total-applicants').textContent=totalApplications;
 $('total-demand').textContent=selectedCount;
 $('total-unwilling').textContent=Math.max(0,validJobCards.length-selectedCount);
}
function buildJobCards(){
 const jobIndex=headers.findIndex(h=>/^(job card number|jobcard number)$/i.test(h.trim()));
 const fallbackIndex=headers.findIndex(h=>/^jc no\.?$/i.test(h.trim()));
 const householdIndex=headers.findIndex(h=>/head of household/i.test(h));
 const nameIndex=headers.findIndex(h=>/name of applicant|applicant name/i.test(h));
 const applicantNoIndex=headers.findIndex(h=>/applicant no/i.test(h));
 const uniqueIdIndex=headers.findIndex(h=>/^unique id$/i.test(h.trim()));
 const keyIndex=jobIndex>=0?jobIndex:fallbackIndex;
 const groups=new Map();
 allRows.forEach((row,i)=>{
  const values=row.values||[];
  const key=normalize(keyIndex>=0?values[keyIndex]:'')||'(Job card number missing)';
  if(!groups.has(key))groups.set(key,{key,household:normalize(householdIndex>=0?values[householdIndex]:''),applicants:[],firstRow:i});
  const group=groups.get(key);
  if(!group.household&&householdIndex>=0)group.household=normalize(values[householdIndex]);
  group.applicants.push({name:normalize(nameIndex>=0?values[nameIndex]:''),number:normalize(applicantNoIndex>=0?values[applicantNoIndex]:''),selectionKey:applicantStableKey(key,values,nameIndex,applicantNoIndex,uniqueIdIndex),values,rowNumber:row.rowNumber});
 });
 jobCards=Array.from(groups.values());
 updateKpis();
}
function getFilteredCards(){
 const q=$('search-input').value.trim().toLocaleLowerCase(),filter=$('selection-filter').value;
 return jobCards.filter(group=>{
  const hasSelection=selectedApplicants.has(group.key);
  if(filter==='selected'&&!hasSelection)return false;
  if(filter==='none'&&hasSelection)return false;
  return !q||[group.key,group.household,...group.applicants.flatMap(a=>[a.name,a.number,...a.values.map(normalize)])].some(v=>String(v||'').toLocaleLowerCase().includes(q));
 });
}
function renderTable(){
 const filtered=getFilteredCards(),totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));currentPage=Math.min(currentPage,totalPages-1);
 const start=currentPage*pageSize,shown=filtered.slice(start,start+pageSize);
 const thead=$('mis-table').querySelector('thead'),tbody=$('mis-table').querySelector('tbody');thead.replaceChildren();tbody.replaceChildren();
 const isMobile=window.matchMedia('(max-width: 700px)').matches;
 const hr=document.createElement('tr');
 (isMobile?['Job Card Details']:['Job Card Number','Head of Household','Applicants']).forEach(label=>{const th=document.createElement('th');th.textContent=label;hr.appendChild(th)});
 thead.appendChild(hr);
 shown.forEach((group,visibleIndex)=>{
  const hasSelection=selectedApplicants.has(group.key);
  const tr=document.createElement('tr');tr.className='jobcard-row '+(hasSelection?'has-selection':'no-selection');
  const toggleGroup=()=>{if(expandedCards.has(group.key)){expandedCards.clear();scrollExpandedCardKey=null}else{expandedCards.clear();expandedCards.add(group.key);scrollExpandedCardKey=isMobile?group.key:null}renderTable()};
  tr.tabIndex=0;
  tr.setAttribute('aria-expanded',String(expandedCards.has(group.key)));
  tr.setAttribute('aria-label',(expandedCards.has(group.key)?'Collapse ':'Expand ')+'applicants for job card '+group.key);
  tr.addEventListener('click',toggleGroup);
  tr.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroup()}});
  if(!isMobile){
   const jobCell=document.createElement('td');jobCell.style.fontWeight='700';jobCell.style.whiteSpace='nowrap';jobCell.textContent=group.key;tr.appendChild(jobCell);
   const householdCell=document.createElement('td');householdCell.textContent=group.household||'—';householdCell.style.fontWeight='600';tr.appendChild(householdCell);
   const countCell=document.createElement('td');countCell.textContent=String(group.applicants.length);countCell.style.fontWeight='700';tr.appendChild(countCell);
  }else{
   const detailCell=document.createElement('td');detailCell.style.verticalAlign='top';
   const firstLine=document.createElement('div');firstLine.style.display='flex';firstLine.style.alignItems='center';firstLine.style.justifyContent='space-between';firstLine.style.gap='8px';
   const cardNumber=document.createElement('div');cardNumber.textContent=group.key;cardNumber.style.fontWeight='750';cardNumber.style.fontSize='0.96rem';cardNumber.style.overflowWrap='anywhere';firstLine.appendChild(cardNumber);detailCell.appendChild(firstLine);
   const secondary=document.createElement('div');secondary.style.display='flex';secondary.style.alignItems='center';secondary.style.flexWrap='wrap';secondary.style.gap='4px 14px';secondary.style.marginTop='5px';secondary.style.fontSize='0.82rem';secondary.style.fontWeight='400';secondary.style.color='#64748b';
   const household=document.createElement('span');household.textContent=group.household||'—';secondary.appendChild(household);
   const applicantsMeta=document.createElement('span');applicantsMeta.textContent='Applicants: '+group.applicants.length;secondary.appendChild(applicantsMeta);
   detailCell.appendChild(secondary);tr.appendChild(detailCell);
  }
  tbody.appendChild(tr);
  if(expandedCards.has(group.key)){
   const detailTr=document.createElement('tr');detailTr.className='applicant-detail';const detailTd=document.createElement('td');detailTd.colSpan=isMobile?1:3;detailTd.style.padding='12px 14px 16px 14px';detailTd.style.background='#f8fafc';
   const subtable=document.createElement('table');subtable.style.width='100%';subtable.style.maxWidth='none';subtable.style.tableLayout='fixed';
   const subhead=document.createElement('thead'),subheadRow=document.createElement('tr');
   ['Name of Applicant','Applicant No.',''].forEach((label,index)=>{const th=document.createElement('th');th.textContent=label;th.style.position='static';th.style.background='#e2e8f0';if(index===0)th.style.width='56%';if(index===1)th.style.width='32%';if(index===2){th.style.width='12%';th.style.textAlign='center';th.style.minWidth='52px'}subheadRow.appendChild(th)});subhead.appendChild(subheadRow);subtable.appendChild(subhead);
   const subbody=document.createElement('tbody');
   group.applicants.forEach((applicant)=>{const ar=document.createElement('tr');
    const applicantId=applicant.selectionKey;
    const name=document.createElement('td');name.textContent=applicant.name||'—';name.style.width='56%';name.style.minWidth='0';name.style.overflowWrap='anywhere';ar.appendChild(name);

    checkbox.addEventListener('change',async()=>{
