<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>Periods — VBGRAMG</title>
<style>\n#period-more-wrap[hidden]{display:none!important}\n
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb;--ink:#172033;--muted:#667085;--line:#e3e8f0;--surface:#fff;--soft:#f7f9fc;--accent:#2457c5;--green:#17663a;--green-bg:#eaf8ef;--closed:#667085;--closed-bg:#f0f2f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;background:#f3f6fb;line-height:1.45}
main{width:min(100%,1440px);max-width:1440px;margin:0 auto;min-width:0}
.topbar,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgb(23 32 51 / 4%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;margin-bottom:14px;flex-wrap:wrap}
.topbar h1{font-size:1.35rem;line-height:1.25;letter-spacing:-.025em;margin:0}
.topbar p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.panel{padding:22px;margin-bottom:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel h2{font-size:1.05rem;margin:0;letter-spacing:-.01em}
button,.link{font:inherit;font-size:.88rem;font-weight:650;border:1px solid #cbd5e1;border-radius:10px;min-height:40px;padding:9px 13px;background:#e2e8f0;color:#0f172a;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:hover{background:#d7e0ec}
button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:#172033;border-color:#172033;color:#fff}
button.secondary{background:#f0f3f8;color:#344054;border-color:#e0e6ef}
button.danger{background:#fff;color:#a12b20;border-color:#f2c9c4}
.status{margin:12px 0 0;padding:11px 13px;border:1px solid #e5eaf2;border-radius:10px;background:#f7f9fc;color:#475467;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem}
.status.error{background:#fff4f2;border-color:#ffd8d2;color:#a12b20}
.status.success{background:#effaf3;border-color:#ccebd7;color:#17663a}
.hidden{display:none!important}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:middle;overflow-wrap:anywhere}
th{background:#f5f7fb;color:#5b6577;font-size:.72rem;letter-spacing:.045em;text-transform:uppercase;font-weight:750}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:750;background:var(--green-bg);color:var(--green)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.closed{background:var(--closed-bg);color:var(--closed)}
.row-actions{display:flex;gap:7px;align-items:center}
.row-actions button{min-width:88px;min-height:38px;padding:7px 10px;font-size:.8rem}
.empty{text-align:center;padding:24px;color:var(--muted)}
.muted{color:var(--muted);font-size:.82rem}
.period-mobile-meta{display:none}
dialog#create-dialog{width:min(92vw,440px);padding:0;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 55px rgb(15 23 42 / 22%);color:var(--ink)}
dialog#create-dialog::backdrop{background:rgb(15 23 42 / 48%)}
.dialog-content{padding:22px}
.dialog-content h2{margin:0 0 8px}
.dialog-content .sub{color:var(--muted);font-size:.85rem;margin:7px 0 18px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.field label{display:block;font-size:.82rem;font-weight:700;margin:0 0 6px;color:#344054}
.field input,.field select{font:inherit;font-size:16px;min-height:46px;padding:10px 12px;border:1px solid #cfd7e4;border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dialog-actions button{min-width:112px}
@media(min-width:701px){
 .table-wrap{overflow-x:auto;overflow-y:hidden}
 .table-wrap table{width:100%;min-width:760px;table-layout:fixed}
 .table-wrap thead th:nth-child(1),.table-wrap tbody td:nth-child(1){width:23%}
 .table-wrap thead th:nth-child(2),.table-wrap tbody td:nth-child(2){width:16%}
 .table-wrap thead th:nth-child(3),.table-wrap tbody td:nth-child(3){width:34%}
 .table-wrap thead th:nth-child(4),.table-wrap tbody td:nth-child(4){width:27%}
 .table-wrap tbody td:nth-child(1){font-weight:700;white-space:nowrap}
 .table-wrap tbody td:nth-child(2){white-space:nowrap}
 .table-wrap tbody td:nth-child(3){white-space:normal;color:var(--muted);font-size:.84rem}
 .row-actions{display:flex;justify-content:flex-start;gap:8px;flex-wrap:nowrap}
 .row-actions button{min-width:96px;white-space:nowrap}
}
@media(max-width:700px){
 body{padding:10px}
 .topbar{padding:15px 16px;align-items:flex-start}
 .panel{padding:15px}
 .panel-head{align-items:center;margin-bottom:13px}
 .panel-head>button{min-height:40px;padding:8px 11px;font-size:.82rem}
 .table-wrap{overflow:visible;border:0;background:transparent}
 table,tbody,tr,td{display:block;width:100%}
 thead{display:none}
 #period-body tr:not(:has(.empty)){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;column-gap:10px;padding:13px 12px;margin-bottom:9px;border:1px solid var(--line);border-radius:13px;background:#fff}
 #period-body td{padding:0;border:0;min-width:0}
 #period-body td[data-label="Period"]{grid-column:1;grid-row:1;font-size:.96rem;font-weight:750;line-height:1.35}
 #period-body td[data-label="Period"]::before,#period-body td[data-label="Actions"]::before{display:none}
 #period-body .period-mobile-meta{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;font-weight:450;line-height:1.45}
 #period-body td[data-label="Status"],#period-body td[data-label="Created"]{display:none}
 #period-body td[data-label="Actions"]{grid-column:2;grid-row:1;display:block;align-self:center}
 #period-body .row-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 #period-body .row-actions button{width:100%;min-width:0;min-height:40px;padding:7px 4px;font-size:.76rem;white-space:normal}
 #period-body .row-actions button[data-action="delete"]{background:#f5f6f8;color:#667085;border-color:#e3e8f0}
 #period-body tr:has(.empty){display:block}
 .dialog-content{padding:18px}
 .dialog-actions{display:grid;grid-template-columns:1fr 1fr}
 .dialog-actions button{width:100%}
}
@media(max-width:360px){
 body{padding:8px}
 .topbar{padding:13px}
 .panel{padding:12px}
 #period-body tr:not(:has(.empty)){padding:11px 10px;column-gap:7px}
 #period-body .period-mobile-meta{font-size:.68rem}
 #period-body .row-actions{gap:5px}
 #period-body .row-actions button{font-size:.72rem;padding:6px 3px}
}

@media(min-width:701px){#period-more-wrap{display:none!important}}
.mobile-see-more-wrap{display:flex;justify-content:center;margin-top:14px}.mobile-see-more-wrap[hidden]{display:none!important}
</style>
  <link rel="stylesheet" href="./responsive.css"></head><body><main>
<header class="topbar app-header"><div class="page-title"><h1>Periods</h1><p>Manage shared periods used by Work Demand and FTO.</p></div></header>

<section class="panel"><div class="panel-head"><h2>All periods</h2><button id="toggle-create" class="secondary" type="button">+ Create period</button></div><dialog id="create-dialog" aria-labelledby="create-heading"><div class="dialog-content"><h2 id="create-heading">Create period</h2><p class="sub">Period names are generated automatically, such as MAY26 and MAY26 (2).</p><div class="grid" id="create-form"><div class="field"><label for="new-month">Charge month</label><input id="new-month" type="month" required></div></div><p class="muted">The first period is dated on the 1st of the charge month; the second on the 2nd, and so on.</p><div class="actions dialog-actions"><button id="create-period" type="button">Save period</button><button id="cancel-create" class="secondary" type="button">Cancel</button></div></div></dialog><div id="status" class="status hidden" aria-live="polite"></div>
<div class="table-wrap"><table><thead><tr><th>Period</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="period-body"><tr><td colspan="4" class="empty">Loading periods…</td></tr></tbody></table></div><div id="period-more-wrap" class="mobile-see-more-wrap" hidden><button id="period-see-more" class="secondary" type="button">See more</button></div></section>
</main><script src="./js/supabase-client.js?v=20261104b"></script><script src="./js/data-loader.js?v=20261104b"></script><script>
const $=id=>document.getElementById(id);let periods=[],sessionUser=null,periodsShown=10;
function setStatus(msg,type=""){if((type==="success"||type==="error")&&window.showToast){window.showToast(msg,type);const el=$("status");el.textContent="";el.className="status hidden";return}const el=$("status");el.textContent=msg;el.className="status"+(type?" "+type:"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function verify(){let client;try{client=await window.VBGRAMG_SUPABASE_READY}catch(error){setStatus(error.message||"Could not initialise the database connection.","error");return false}const {data,error}=await client.auth.getSession();if(error||!data.session){location.replace("./");return false}try{const access=await window.VBGRAMGData.request("vbgramg-app-access",{body:{}});if(!access||access.approved!==true)throw new Error("App access was denied.")}catch(error){await client.auth.signOut();location.replace("./");return false}sessionUser=data.session.user;return true}
async function call(action,extra={},options={}){return window.VBGRAMGData.request("vbgramg-periods",{body:{action,...extra},...options})}
function render(){const body=$("period-body"),isMobile=window.matchMedia("(max-width: 700px)").matches,visiblePeriods=isMobile?periods.slice(0,periodsShown):periods;body.replaceChildren();if(!periods.length){$("period-more-wrap").hidden=true;const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=4;td.className="empty";td.textContent="No periods yet. Use Create period to add the first period.";tr.appendChild(td);body.appendChild(tr);return}
for(const p of visiblePeriods){const tr=document.createElement("tr");const created=p.created_at?new Date(p.created_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"—";const month=p.contribution_month||p.period_date;const monthText=month?new Date(month+"T00:00:00Z").toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"}):"Legacy month unknown";const periodTd=document.createElement("td");periodTd.dataset.label="Period";periodTd.className="period-name-cell";periodTd.textContent=String(p.period_name??"—");const meta=document.createElement("span");meta.className="period-mobile-meta";meta.textContent=(p.status==="open"?"Open":"Closed")+" · "+created;periodTd.appendChild(meta);tr.appendChild(periodTd);const statusTd=document.createElement("td");statusTd.dataset.label="Status";const badge=document.createElement("span");badge.className="pill"+(p.status==="closed"?" closed":"");badge.textContent=p.status==="open"?"Open":"Closed";statusTd.appendChild(badge);tr.appendChild(statusTd);const createdTd=document.createElement("td");createdTd.dataset.label="Created";createdTd.textContent=created;tr.appendChild(createdTd);
const td=document.createElement("td");td.dataset.label="Actions";const actions=document.createElement("div");actions.className="row-actions";
const toggle=document.createElement("button");toggle.type="button";toggle.className=p.status==="open"?"danger":"secondary";toggle.textContent=p.status==="open"?"Close":"Reopen";toggle.addEventListener("click",()=>togglePeriod(p));actions.appendChild(toggle);if(!p.used){const del=document.createElement("button");del.type="button";del.className="danger";del.dataset.action="delete";del.textContent="Delete";del.addEventListener("click",()=>deletePeriod(p));actions.appendChild(del);}td.appendChild(actions);tr.appendChild(td);body.appendChild(tr)}const showMore=isMobile&&periods.length>periodsShown;$("period-more-wrap").hidden=!showMore;}
async function createPeriod(){const month=$("new-month").value,periodDate=month?month+"-01":"";if(!month){setStatus("Choose a charge month.","error");return}$("create-period").disabled=true;try{const r=await call("create",{contributionMonth:month+"-01",periodDate});setStatus("Created period "+r.period.period_name+" dated "+periodDate+".","success");$("new-month").value="";await load()}catch(e){setStatus(e.message,"error")}finally{$("create-period").disabled=false}}
async function deletePeriod(p){if(!confirm("Delete period “"+p.period_name+"”? Deletion is allowed only when this period has never been used."))return;try{await call("delete",{id:p.id});setStatus("Period "+p.period_name+" deleted.","success");await load()}catch(e){setStatus(e.message,"error")}}
async function load(){$("period-more-wrap").hidden=true;try{const result=await call("list",{}, {deduplicate:true});periods=result.periods||[];periodsShown=10;render();$("status").textContent="";$("status").className="status hidden"}catch(e){setStatus(e.message,"error")}}
async function togglePeriod(p){const action=p.status==="open"?"close":"reopen";if(!confirm((action==="close"?"Close":"Reopen")+" period “"+p.period_name+"”? "+(action==="close"?"It will no longer appear in normal assignment dropdowns.":"It will become available for new assignments.")))return;try{await call(action,{id:p.id});setStatus("Period "+p.period_name+" "+(action==="close"?"closed.":"reopened."),"success");await load()}catch(e){setStatus(e.message,"error")}}

$("period-see-more").addEventListener("click",()=>{periodsShown=Math.min(periods.length,periodsShown+10);render()});
let lastPeriodsMobile=window.matchMedia("(max-width: 700px)").matches;window.addEventListener("resize",()=>{const next=window.matchMedia("(max-width: 700px)").matches;if(next!==lastPeriodsMobile){lastPeriodsMobile=next;render()}});
$("create-period").addEventListener("click",createPeriod);$("toggle-create").addEventListener("click",()=>{const dialog=$("create-dialog");if(typeof dialog.showModal==="function")dialog.showModal();else dialog.setAttribute("open","");$("new-month").focus()});$("cancel-create").addEventListener("click",()=>{$("new-month").value="";$("create-dialog").close()});$("create-dialog").addEventListener("close",()=>{$("new-month").value=""});
(async()=>{if(await verify())await load()})();
</script><script src="./toast.js?v=20261103"></script><script src="./navigation.js?v=20261031f"></script></body></html>
