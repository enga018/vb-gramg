name: Playwright MIS portal diagnostics (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mis-headless-fetch
  cancel-in-progress: false

jobs:
  fetch-mis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Navigate the official portal and inspect report
        run: python scripts/fetch_mis_preview.py

      - name: Upload HTML and JSON diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-playwright-diagnostics
          path: output/*
          if-no-files-found: warn
          retention-days: 7
