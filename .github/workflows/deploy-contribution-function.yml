name: Deploy contribution Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vbgramg-contribution-data/**'
      - '.github/workflows/deploy-contribution-function.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy contribution Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vbgramg-contribution-data --project-ref trtzhafgvqosjwrgckty --use-api
